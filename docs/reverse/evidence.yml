  - id: combat.missed_turn_is_spent_at_the_top
    title: MISS_TURNS sits the actor out of its turn, after the worn items' start hooks and before the status effects'
    area: combat
    verdict: mechanic
    status: inferred
    confidence: high
    source_pass: item_hooks
    summary: >
      The placement is what the two bodies that use it on a turn boundary
      require. ITUT is described as "Owner never takes a turn", and its body is
      an OnStartTurn - so the status it sets has to be read after that hook
      runs and before anything else, or the owner would take the turn it just
      asked to miss. The scripts also call OnStartTurn "before the turn is
      actually started", which is the same window. A missed turn therefore
      advances the round and the cap, announces itself, and does nothing else:
      no status ticks, no spell, no swap, no cooldown tick - and the check has
      to come before the status start hooks anyway, because
      run_start_of_turn_effects keeps only ids it has a descriptor for and
      would drop [Missed], a pseudo-status with none, before anything could act
      on it.
    evidence:
