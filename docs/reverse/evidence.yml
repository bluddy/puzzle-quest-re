  - id: font.glyph_advance_is_stored
    title: The glyph advance is a stored field, and its relation to leading/trailing is not recovered
    area: render
    verdict: presentation
    status: inferred
    confidence: medium
    audited: true
    source_pass: font_pass
    summary: >
      A string's width is accumulated by `FUN_004c7650`, which sums one field per
      character - `+0x18` - for the middle characters, and treats the first and
      last differently:

      ```
        first character :  glyph+0x1c + glyph+0x18
        middle characters:         glyph+0x18
        last character  :  glyph+0x14 - glyph+0x1c
      ```

      `+0x14` is the glyph rectangle's width: `FUN_004c75e0` uses width, x and y
      all being zero as the "no such glyph" sentinel, which fixes those three
      fields. So `+0x18` is the advance. **What `+0x1c` holds is not recovered**,
      because for a single 'A' in Small the first-character and last-character
      branches disagree - 25 against 10 - and only one of them can be right.

      The port advances by the glyph's ink width. Two measurements support it:

      - **`leading + trailing` already equals the ink width**, for 94% of glyphs,
        rather than adding to it. Summing all three would double the tracking.
      - **The atlas packs each cell edge to edge** with one pixel between, so the
        ink has no baked-in offset to compensate for. Measured off System.png: the
        ink of code 33 starts one pixel into a cell whose `leading` is 2.

      The one case where ink width is wrong is a glyph with no ink - the space in
      every face, whose rectangle is a 1px placeholder while its bearings still
      add up to a real space. So the port takes the larger of the two.
    evidence:
      - kind: decompiled
        ref: docs/decompiled/font/Font_measure_advance_FUN_004c7650.c
        quote: |
          if (iVar5 == 0) {
            iVar3 = *(int *)(iVar3 + 0x1c + *(int *)(param_1 + 0x3c)) + *(int *)(iVar3 + *(int *)(param_1 + 0x3c) + 0x18);
          }
          else { ... iVar3 = (int)*(short *)(iVar3 + 0x14 + iVar1) - *(int *)(iVar3 + iVar1 + 0x1c); }
      - kind: decompiled
        ref: docs/decompiled/font/Font_glyph_present_FUN_004c75e0.c
        note: the all-zero-rectangle sentinel, which fixes +0x10/+0x12/+0x14 as x, y and width
      - kind: xml
        ref: game/Assets.zip!Assets/Fonts/Small.xml
        note: "'A' is width 12, leading 2, trailing 9 - bearings that sum to the ink, not to 23"
    affects: [gfx/font_layout.ml]
    notes: >
      The 127 glyphs whose bearings exceed their ink by more than 3px are all in the
      heading and script faces; System, Small and WC_Message - the three the battle
      screen draws - have one between them. test_font_data pins that split, so an
      offender appearing in a HUD face fails the build.

      Also recovered in the same function, and relied on: U+00A0 is substituted for
      a plain space before measuring, and a code outside the face's range or with no
      glyph becomes the face's fallback character, kept at +0x44 on the font record.
      The fallback's value is unknown, so the port draws nothing rather than a guess.

