  - id: pres.add_effect_to_grid
    title: ADD_EFFECT_TO_GRID is a sparkle on one cell
    area: render
    verdict: presentation
    status: recovered
    confidence: high
    audited: true
    source_pass: spell_effects
    summary: >
      Resolves the cell's pixel coordinates and makes one animeffect call. This
      reading is what unblocked 21 spell bodies, since in most of them the whole
      mechanic was the single SET_GEM or DELETE_GEM the sparkle decorated.
    evidence:
      - kind: decompiled
        ref: docs/decompiled/Engine_ADD_EFFECT_TO_GRID_4b51d0.c
        quote: |
          iVar2 = sStack_1c + 0x24;   // the cell's pixel coordinates
          iVar1 = sStack_1a + 0x24;
          FUN_004bddc0(iVar1, iVar2); // one animeffect call
    affects: [lib/spell_effects.ml]

  - id: pres.add_effect_to_character
    title: ADD_EFFECT_TO_CHARACTER is a sparkle on a character
    area: render
    verdict: presentation
    status: recovered
    confidence: high
    audited: true
    source_pass: spell_effects
    summary: >
      The character-space twin of ADD_EFFECT_TO_GRID: resolves the target's
      position and makes one animeffect call. Nothing else.
    evidence:
      - kind: decompiled
        ref: docs/decompiled/Engine_ADD_EFFECT_TO_CHARACTER_4b0690.c
    affects: [lib/spell_effects.ml]

  - id: pres.animeffect_to_grid_and_character
    title: ADD_ANIMEFFECT_TO_GRID / _TO_CHARACTER are pixel-space only
    area: render
    verdict: presentation
    status: recovered
    confidence: high
    audited: true
    source_pass: presentation_audit
    summary: >
      Audited. Both resolve a screen position and hand it to one "play this
      effect" call. Neither reads nor writes life, mana, gems or status effects.

      The grid form computes the cell's pixel coordinates directly:
      `*param_3 = param_1 * 0x4a + 0x29` and `*param_4 = param_2 * 0x4a + 0x2f`,
      i.e. a 74-pixel tile grid with a 41/47 origin. The character form asks for
      the character's screen point as two shorts and then subtracts two fields at
      +0x3cc and +0x3d0, which is the camera or scroll offset.

      What state they *do* touch is a lazily allocated animation-slot cache
      (DAT_00583100, a 0x24-byte object keyed by handle) - an allocation, not a
      game rule. The character index is used only to pick the right slot, so the
      effect lands on the right character without affecting the simulation.
    evidence:
      - kind: decompiled
        ref: docs/decompiled/Lua_ADD_ANIMEFFECT_TO_GRID.c
        fn: Lua_ADD_ANIMEFFECT_TO_GRID
      - kind: decompiled
        ref: docs/decompiled/Engine_ADD_ANIMEFFECT_TO_GRID_47b3a0.c
        quote: |
          *param_3 = param_1 * 0x4a + 0x29;   // 74px tiles, x
          *param_4 = param_2 * 0x4a + 0x2f;   // 74px tiles, y
      - kind: decompiled
        ref: docs/decompiled/Engine_ADD_ANIMEFFECT_TO_CHARACTER_47b370.c
        quote: |
          *param_4 = param_2 - *(int *)(param_1 + 0x3cc);   // camera offset
          *param_5 = param_3 - *(int *)(param_1 + 0x3d0);
      - kind: decompiled
        ref: docs/decompiled/Engine_ADD_ANIMEFFECT_TO_GRID_483380.c
        note: lazily allocates the per-effect slot object
    affects: [lib/spell_effects.ml, lib/status_effect_hooks.ml]
    notes: >
      Needed for rendering, and now cheap: the tile pitch is 74px and the origin
      offsets are 41 and 47.

  - id: pres.std_spell_effect_family
    title: The four Std_*SpellEffect helpers are asset lookups and nothing else
    area: render
    verdict: presentation
    status: recovered
    confidence: high
    audited: true
    source_pass: presentation_audit
    summary: >
      Audited, and it needed no decompilation: all four are Lua, in
      Assets/Scripts/StandardUtilityScripts.lua. They were assumed to be C
      natives, which is why this one sat unaudited for so long.

      Each takes a SPELLFX_* constant, resolves it to an asset name through
      Std_GetSpellFXAsset, resolves a sound through Std_GetSpellSoundAsset, and
      then calls ADD_ANIMEFFECT_TO_CHARACTER / ADD_ANIMEFFECT_TO_GRID and
      PLAY_SOUND. That is the whole body. No life, no mana, no gems, no status
      effects.

      Std_CastSpellEffect has one special case, SPELLFX_DEFAULT, which skips the
      lookup and plays Spell0 + Spell1 on the caster with a fixed sound.
      Std_EnemySpellEffect calls GET_ENEMY only to aim the animation at the enemy.
    evidence:
      - kind: lua
        ref: game/Assets.zip!Assets/Scripts/StandardUtilityScripts.lua
        quote: |
          function Std_GridSpellEffect(x,y,typ,useSound)
              local spellfx = Std_GetSpellFXAsset(typ);
              local soundfx = Std_GetSpellSoundAsset(typ);
              if (spellfx ~= "") then ADD_ANIMEFFECT_TO_GRID(x,y,spellfx); end
              if (soundfx ~= "" and useSound==1) then PLAY_SOUND(soundfx); end
          end
    affects: [lib/spell_effects.ml, lib/status_effect_hooks.ml]
    notes: >
      useSound is compared `== 1`, so a truthy non-1 is silent. Two scripts pass
      0 and two pass 1; transcribing as `== 1` rather than as truthiness is what
      the file says.

  - id: render.spell_fx_asset_table
    title: Std_GetSpellFXAsset maps 21 SPELLFX constants to animeffect names
    area: render
    verdict: presentation
    status: recovered
    confidence: high
    audited: true
    source_pass: presentation_audit
    summary: >
      A plain if/elseif chain from SPELLFX_* to a string asset name, read
      directly. This is the table a renderer needs and it costs nothing to
      transcribe - there is no lookup to reverse.

      SPELLFX_HURLGOBLIN maps to the same asset as SPELLFX_FIREBALL
      ("SpellFireball"), which is the kind of copy-paste the file invites.
    evidence:
      - kind: lua
        ref: game/Assets.zip!Assets/Scripts/StandardUtilityScripts.lua
        note: Std_GetSpellFXAsset
    affects: []
    notes: Not yet transcribed to OCaml; no renderer exists to consume it.

  - id: render.spell_sound_asset_table
    title: Std_GetSpellSoundAsset maps SPELLFX constants to sound names
    area: render
    verdict: presentation
    status: recovered
    confidence: high
    audited: true
    source_pass: presentation_audit
    summary: >
      The same shape as the FX table. Several constants share a sound - NECRO,
      FROST, WATER and SYMBOL are all "snd_spellalter" - so the mapping is many
      to one.
    evidence:
      - kind: lua
        ref: game/Assets.zip!Assets/Scripts/StandardUtilityScripts.lua
        note: Std_GetSpellSoundAsset
    affects: []

  - id: pres.add_text_message
    title: ADD_TEXT_MESSAGE / _MESSAGE2 / _TO_CHARACTER / _TO_CHARACTER2 are UI layout
    area: ui
    verdict: presentation
    status: recovered
    confidence: high
    audited: true
    source_pass: presentation_audit
    summary: >
      Audited. All four are floating-point-text layout. They validate their
      arguments, compute a position, and add a text object.

      The positioning is "centre it, then keep it on screen":
      `iVar7 = width_of_line + DAT_0059a4c8 / 2` centres horizontally against a
      global screen width, and the y term stacks by line height. ADD_TEXT_MESSAGE2
      differs only by `+ 0x24` against ADD_TEXT_MESSAGE's `- 0x28`, i.e. a
      different vertical offset in the message stack - which is why
      Std_Healing and Std_Healing2 are mechanically identical despite looking
      different in the spell scripts.

      The recursion in Engine_ADD_TEXT_MESSAGE_4bc4c0 is a bounding-box walk up
      the message list, summing each entry's width at +0xc while the parent
      pointer at +0x28 is non-null.

      **Correction.** This function's `(list_end - list_start) / 0x3c` was read
      earlier in this project as a timer. It is not: it is the number of 60-unit
      slots in the message stack, used to find the last element's base offset.
      Nothing timed.
    evidence:
      - kind: decompiled
        ref: docs/decompiled/Lua_ADD_TEXT_MESSAGE.c
        fn: Lua_ADD_TEXT_MESSAGE
      - kind: decompiled
        ref: docs/decompiled/Engine_ADD_TEXT_MESSAGE_4bc4c0.c
        quote: |
          if (*(int *)(param_1 + 0x28) != 0) {          // parent pointer
            iVar1 = Engine_ADD_TEXT_MESSAGE_4bc4c0();   // walk up the stack
            return (uint)*(ushort *)(param_1 + 0xc) + iVar1;   // + this width
          }
      - kind: decompiled
        ref: docs/decompiled/Engine_ADD_TEXT_MESSAGE_415120.c
        note: screen clamping against DAT_0059a4c8 with a 20px margin
    affects: [lib/spell_effects.ml, lib/status_effect_hooks.ml]
    notes: >
      Two scripts compute a value purely to format it into one of these -
      SWOP's damage and SSWM's numSkulls, the latter an undefined global. That is
      a bug in their text and changes no mechanic.

  - id: pres.play_sound
    title: PLAY_SOUND looks a named sound up and plays it, skipping one already playing
    area: render
    verdict: presentation
    status: recovered
    confidence: high
    audited: true
    source_pass: presentation_audit
    summary: >
      Audited. Looks the name up in a map under a global manager, and calls a
      virtual play method - but only if that entry is not already the active one:

      ```c
      piVar2 = FUN_004b28c0(local_4,&param_1);            // name -> entry
      if ((*piVar2 != *(int *)(iVar1 + 8)) && ...) {       // not already playing
        (**(code **)(*piVar2 + 0x28))();                  // play
      }
      ```

      So it de-duplicates: a sound already sounding is not restarted. Nobody
      should model that as "play every time" when the audio layer is written.
    evidence:
      - kind: decompiled
        ref: docs/decompiled/Engine_PLAY_SOUND_4b38a0.c
        fn: Engine_PLAY_SOUND_4b38a0
    affects: [lib/spell_effects.ml, lib/status_effect_hooks.ml]

