      The consumer exists and was found by scanning the binary for reads of the
      offset rather than by reading decompilation, which never captured one. At
      0x0047d24d the flag is loaded and tested; when it is zero the routine
      substitutes the raw unscaled value into five message slots, and when it is
      set it leaves the scaled value in place. The surrounding code builds
      `100 + x * factor * 0.01` percentages (the two float constants it uses are
      0.01 at 0x0051e4c8 and 100.0 at 0x005217b4), so the flag decides whether
      the number shown to the player is the multiplied one or the true one.

