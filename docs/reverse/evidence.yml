        note: spend_missed_turn, placed between start_turn_item_hooks and run_start_of_turn_effects
      - kind: code
        ref: lib/spell_effects.ml
        note: miss_turns, which records the [Missed] pseudo-status
      - kind: code
        ref: test/test_item.ml
        note: the skip, the two-turn decrement, ITUT never acting, IFZT's stun
    affects: [lib/battle.ml, lib/item_hooks.ml]
    notes: >
      SSTU and SWOP set the same status from spell bodies, so they skip turns
      through this path too - which is the change in AI battle outcomes that
      kept this out of two earlier rounds.

open_questions:

  - id: quest.base_value_from_level
    question: Does the effective-skill query fold level into the mana ceiling, or is it the raw skill?
    why_it_matters: >
      The ceiling's shape is recovered - 25 + (effective skill + 1) / 2, computed
      by the character constructor at 0x4661f0 and moved by ADD_TEMP_SKILL's
      delta (mana.ceiling.base_value). What "effective" means is not: it comes
      from a virtual call taking (kind 5, raw skill, level, element), so level is
      handed to it and may or may not come back out. The port uses the raw skill,
      and the difference is visible: the decoded hero that banks 31 Fire at level 5
      needs an effective skill of 11, where a profession's raw base of 3 gives 27 -
      so either the real Masteries grow with level or the query folds level in,
      and every ceiling - and with it every "pool is full" test the AI makes -
      moves by the answer.
    would_be_settled_by:
      - Disassembling the character vtable's slot at +0x20 for the hero class.
      - A decoded .pqhero's seven Masteries read next to its mana pools, which
        pins the effective skill the formula had to produce.
    related: [mana.ceiling.base_value, mana.temp_skill_writes_the_skill_array, mana.ceiling.only_written_by_set_max]
    notes: >
      The original question asked what sets the ceiling at construction and
      whether it scales with level; the first half is now recovered and folded
      into mana.ceiling.base_value, so only the level question is left here. The
      save carries the seven Masteries and no ceiling, which is what makes a
      decoded hero the other way to settle it.
    status: recovered
    resolution: >
      Level does not fold in. The kind-5 query at 0x466610 starts from the raw
      skill (the `skill` argument, which GET_SKILL at 0x465f30 reads from
      char+0x48+skillIdx*4), folds the equipped items' OnQuerySkill hooks
      (dispatched by 0x475340), folds the active status effects' OnQuerySkill
      hooks (0x4711c0), and then adds the temp-skill accumulator at
      record[skillIdx*4 + 0x68]. The `level` argument is passed but never read
      in the kind-5 path. The hero override at 0x469370 calls the base and only
      folds companions for kind==1, so it is inert here.

      The decoded hero that banks 31 Fire at level 5 is explained by training:
      the train-skill native at 0x402920 raises the raw skill by spending XP
      ((effective + 9) * 50 from the XP field at +0x94), and the temp-skill
      accumulator - written by ADD_TEMP_SKILL at 0x48c5ba - adds on top. The
      profession XMLs carry no per-level skill growth: only <Level life="2"/>
      and the XP ladder, so skills grow only via training and temp bonuses,
      never automatically with level.

      The port's use of the raw skill as the base is correct. What was missing
      is the item OnQuerySkill fold and the accumulator being added after the
      status hooks rather than merged into the raw skill; both are wired in the
      round that closed this.

  - id: quest.skull_scaling_consumer
    question: What reads board flag +0x392?
    why_it_matters: >
      It is modelled with no consumer. Either the offset is mislabelled or a
      mechanic is missing from the board resolution.
    would_be_settled_by:
      - A cross-reference sweep on the flag byte in the decompiler output.
    related: [board.flag_skull_scaling, board.multiplier_flags_save_and_clear]
    status: refuted
    resolution: >
      The premise was wrong - a consumer exists, and the decompiler output never
      captured one because every dumped function only writes the flag. Scanning
      the binary directly found two reads, at 0x0047d24d and 0x0047d9c5; the
      first is in a percentage-formatting routine that substitutes the unscaled
      value when the flag is clear. See board.flag_skull_scaling. The lesson for
      the next sweep is in tools/scan_field_refs.py: decompilation coverage is
      not reference coverage.

