    affects: [lib/board.ml, lib/spell.ml, lib/combat.ml]

  # -------------------------------------------------------------- combat ----

  - id: combat.turn_order
    title: Turn order is a rotation of the roster seeded by the highest Cunning
    area: combat
    verdict: mechanic
    status: recovered
    confidence: high
    source_pass: turn_manager
    summary: >
      The roster rotates; the scan only decides who leads. An unbroken tie keeps
      the first combatant in roster order.
    evidence:
      - kind: doc
        ref: docs/COMBAT_FLOW.md
    affects: [lib/combat.ml, lib/battle.ml]

  - id: combat.extra_turn_chance
    title: Extra turn chance is gained/100, rolled per element per match
    area: combat
    verdict: mechanic
    status: recovered
    confidence: high
    source_pass: original_reverse
    summary: Identified from a playtesting observation and then confirmed in the binary.
    evidence:
      - kind: doc
        ref: docs/SPELLS.md
        note: section 4, FUN_0047D4F0
    affects: [lib/spell.ml, lib/battle.ml]

  - id: combat.stack_limit_per_effect
    title: The stack attribute caps copies of one effect, not effects overall
    area: combat
    verdict: mechanic
    status: recovered
    confidence: high
    source_pass: status_effects
    summary: >
      Four of the seventeen stack above 1. An earlier draft counted all effects
      together, silently capping a character at one Disease despite stack="4".
    evidence:
      - kind: xml
        ref: game/Assets.zip!Assets/StatusEffects/Disease.xml
        note: stack="4"
    affects: [lib/combat.ml]

  - id: combat.hook_table_37
    title: 37 hook names at 0x005239E8 are the complete scripting surface
    area: combat
    verdict: mechanic
    status: recovered
    confidence: high
    source_pass: original_reverse
    summary: >
      The strings run out at 0x00523C3C, where a Lua argument-type error message
      begins, so 37 is the real count and not a scan artifact.
    evidence:
      - kind: code
        ref: lib/combat.ml
        note: all_hook_names
      - kind: doc
        ref: docs/LUA_API.md
    affects: [lib/combat.ml, lib/item.ml]

  - id: combat.is_spell_castable
    title: Castability is a per-pool comparison; the air check is gated
    area: combat
    verdict: mechanic
    status: recovered
    confidence: high
    source_pass: original_reverse
    summary: >
      The air pool is only tested when the "spells disallowed this turn" flag is
      set, which is how a status effect suppresses casting. That flag is what
      Blinded raises.
    evidence:
      - kind: decompiled
        ref: docs/decompiled/Engine_IS_SPELL_CASTABLE_474b40.c
    affects: [lib/spell.ml, lib/combat.ml]

# ------------------------------------------------------------ open questions ----

open_questions:

  - id: quest.base_value_from_level
    question: What sets the per-element mana ceiling at hero construction, and does it scale with level?
    why_it_matters: >
      Every spell and every AI hook that tests GET_MANA_* against a number is
      being judged against a ceiling that is currently a chosen 20. If the real
      value is f(level, class), a large fraction of the AI's decisions are wrong
      in a way no test would catch.
    would_be_settled_by:
      - The hero or party constructor that writes +0x84 outside the battle object.
      - Whether the save record's single mana quadruple is the pool or the ceiling.
    related: [mana.ceiling.base_value, mana.ceiling.only_written_by_set_max]
    status: open

  - id: quest.skull_scaling_consumer
    question: What reads board flag +0x392?
    why_it_matters: >
      It is modelled with no consumer. Either the offset is mislabelled or a
      mechanic is missing from the board resolution.
    would_be_settled_by:
      - A cross-reference sweep on the flag byte in the decompiler output.
    related: [board.flag_skull_scaling]
    status: open

  - id: audit.animeffect_family
    question: Is any dropped presentation call secretly mechanical?
    why_it_matters: >
      Three of the seventeen status effects were inert before this pass, and the
      expiry rule was inverted with two tests asserting it. The same failure mode
      is live for every unaudited presentation call, and the port has to render
      these eventually, so the work is not wasted either way.
    would_be_settled_by:
      - Decompiling ADD_ANIMEFFECT_TO_GRID, ADD_ANIMEFFECT_TO_CHARACTER, the four
        Std_*SpellEffect names, ADD_TEXT_MESSAGE* and PLAY_SOUND.
    related:
      - pres.animeffect_to_grid_and_character
      - pres.std_spell_effect_family
      - pres.add_text_message
      - pres.play_sound
    status: open

  - id: asset.status_effect_id_mismatches
    question: Why does EFBO have no STATUS_EFFECT_ constant, and EDOO a constant with no XML?
    why_it_matters: >
      Benign so far - spells pass the raw string and the id is still the id - but
      it means the two tables are not redundant and neither can be generated from
      the other.
    would_be_settled_by:
      - Nothing further needed; recorded so it is not treated as a bug to fix.
    related: [status.keyed_by_xml_id]
    status: refuted
    resolution: >
      Not a defect. Spells pass the raw string and the id is still the id, so the
      two tables are complementary rather than redundant, and neither can be
      generated from the other.

  - id: spell.sfba_target_writeback
    question: How does SFBA's SET_INPUT_DATA target reach CastSpell?
    why_it_matters: >
      The scoring is ported; the write-back is not. In a headless port the target
      comes from the spell's input_type, which is the human's aim - correct for a
      player, wrong for an AI casting it.
    would_be_settled_by:
      - Deciding where an AI's chosen cell is meant to live.
    related: [spells.ai.coverage]
    status: open

# --------------------------------------------------------- port decisions ----

# Choices we made, not facts about the game. Kept apart so that changing our
# mind about one does not look like new evidence about the original.

port_decisions:

  - id: port.hooks_take_context
    decision: Status effect hooks take a Combat.status_context, not a character index
    rationale: >
      The Lua passes characterIdx into the battle's character array. There is no
      such array here - a battle is a combatant list - and three of the seventeen
      need GET_ENEMY anyway. Only the seven hooks the scripts use take a context;
      the other thirty keep their indices because nothing calls them.
    supersedes: null
    date: 2026-10-04

  - id: port.match_hooks_return_unit
    decision: OnMatch4 / OnMatch5 are typed unit, not int
    rationale: >
      Item.hooks types its own on_match4 as returning an int, so the two records
      disagree. Vigiled is the only implementer and its Lua returns nothing.
      Whether the engine reads nil back as a zero contribution is not recovered.
    supersedes: null
    date: 2026-10-04

  - id: port.sfca_loop_cap
    decision: SFCA's unbounded repeat loop is capped at 1000 attempts
    rationale: >
      The only deliberate divergence from the original. Unreachable in practice -
      boards are refilled before spell effects, and four 3x3 explosions remove at
      most 36 of 64 cells - but it cannot terminate as written.
    supersedes: null
    date: 2026-10-04

  - id: port.headless_first
    decision: The port was built headless and animation-free
    rationale: >
      A deliberate fast path, not the destination. The target is a playable
      product, so the presentation layer has to be reversed eventually. This
      decision is superseded in intent, not reversed in fact - the mechanic layer
      is what made the presentation layer tractable.
    supersedes: null
    date: 2026-10-04
    status: superseded_in_intent

  - id: port.presentation_dropped
    decision: Presentation calls are dropped rather than implemented
    rationale: >
      Valid while headless. Needs revisiting for a playable build, at which point
      the audit in audit.animeffect_family is the first step rather than an
      alternative to it.
    supersedes: port.headless_first
    date: 2026-10-04
    status: open