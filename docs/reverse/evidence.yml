  - id: skin.jpeg_needs_imagelib_fork
    title: Reading the backdrop needs imagelib's jpeg-codec fork; the opam release cannot decode JPEG
    area: render
    verdict: presentation
    status: recovered
    confidence: high
    audited: true
    source_pass: decoration_pass
    summary: >
      The opam release of `imagelib` has an `ImageJPG` module but does not wire it
      into `ImageLib.openfile`, so `openfile ~extension:"jpg"` raises
      `Not_yet_implemented "jpg"`. The `jpeg-codec` fork of
      `github.com/bluddy/ocaml-imagelib` adds the dispatch branch, pinned here at
      `00243ab8`.

      **The two builds also disagree about the extension spelling**, which is a
      separate trap: the release lists `extensions = ["png"]` and the fork lists
      `[".png"]`, and `openfile` does a bare `List.mem` with no normalising. So
      `"png"` works against the release and raises against the fork, while `"jpg"`
      raises against the release. `gfx/png.ml` tries the dotted spelling and falls
      back, so the port runs against either build - but only the fork can decode a
      JPEG at all.

      Recorded because it is a build-time requirement that lives in opam state
      rather than in the repository, so a fresh clone gets a release and a black
      screen.
    evidence:
      - kind: code
        ref: gfx/png.ml
        note: try_both tries ".png" then "png", because the two builds disagree
      - kind: doc
        ref: README.md
        note: the requirements section carries the pin, since no opam file is committed
    affects: [gfx/png.ml, README.md, tools/graphics_plan.md]
    notes: >
      This is the second git pin in the project; `tsdl-mixer` is pinned the same
      way. Neither is in a committed opam file, so the README is the only thing
      that records them.

      An earlier version of the graphics plan deferred JPEG on the grounds that the
      archive's 63 JPGs are backgrounds and none are needed for a board. That was
      true and it left the one image the screen is mostly made of unreadable.

  - id: sound.registry_and_bank
    title: The registry names 82 sounds, 68 of which have audio; every music tag has none
    area: render
    verdict: presentation
    status: recovered
    confidence: high
    audited: true
    source_pass: sound_pass
    summary: >
      `Assets/Assets.xml` has a third section after `<Bitmap>` and `<BitmapImage>`:
      82 `<Sound tag="snd_*" type="interface|music" priority fade>` entries. The tag
      is what `Engine_PLAY_SOUND_4b38a0` is handed, so the port addresses sounds by
      tag rather than by filename.

      **The tag does not give the filename**, which is the thing worth recording.
      Most are `snd_<stem>` for a `<Stem>.wav` - `snd_damage` is `Damage.wav` - but
      the four element sounds carry a `Mana` suffix (`snd_earth` is `EarthMana.wav`),
      the buttons are `ButtonDown`/`ButtonUp`, three interface sounds are named after
      what they are (`snd_illegal` is `IllegalMove.wav`), and the voice lines sit in
      a per-language directory behind a `V` prefix with **the tag and the file
      disagreeing**: `snd_voice_victory` is `VVictorious.wav`. So the mapping is a
      convention with exceptions, and `lib/skin_data.ml` records *how* each tag was
      resolved - `Exact`, `Renamed`, or `Absent` - so a reader can tell a filename
      match from a rule applied on top.

      **Every `music_*` tag has no audio behind it in this archive.** There are no
      Ogg, MP3 or module files at all; the 83 WAVs are the whole bank. A music player
      written against this registry would find that out at runtime, which is the
      argument for checking rather than assuming.

      Voice lines ship three times over, once per language - `English/Sounds`,
      `French/Sounds`, `German/Sounds` - which is why there are more voice files than
      voice tags. The generator resolves one language and says which.
    evidence:
      - kind: xml
        ref: game/Assets.zip!Assets/Assets.xml
        quote: '<Sound tag="snd_buttdown" precache="1" cache="cachelocked" type="interface" priority="6" fade="0">'
      - kind: xml
        ref: game/Assets.zip!Assets/Assets.xml
        note: 82 Sound entries, 30 of them music
      - kind: binary
        ref: game/Assets.zip
      - kind: binary
        ref: game/Assets.zip
        note: 'snd_voice_victory resolves here, and the names do not match'
    affects: [lib/skin_data.ml, gfx/audio.ml, gfx/sound_map.ml, tools/extract_skin_data.py, tools/extract_gfx_assets.py]
    notes: >
      Sound banks are extracted preserving their directory layout rather than
      flattened, because the generated table holds those paths verbatim - flattening
      would make the table wrong rather than merely untidy.

      `type="music"` is a real distinction in the registry and not a comment: all 14
      music tags are `Absent`, all 68 playable ones are `interface`.

  - id: sound.cascade_sound_per_step
    title: A match does not make a noise - the first cascade step is silent and the sound climbs to a ceiling
    area: render
    verdict: presentation
    status: recovered
    confidence: high
    audited: true
    source_pass: sound_pass
    summary: >
      `FUN_0047AE80` - the per-swap cascade function - increments a counter and
      switches on it to choose a sound, and the first two counter values **skip the
      sound entirely**:

      ```c
      counter = read_dword(param_1 + 0x3c8) + 1;
      write_dword(param_1 + 0x3c8, counter);
      switch (counter) {
        case 0:
        case 1: goto skip;                  // silent
        case 2: pwVar5 = L"snd_cascade1"; break;
        case 3: pwVar5 = L"snd_cascade2"; break;
        case 4: pwVar5 = L"snd_cascade3"; break;
        case 5: pwVar5 = L"snd_cascade4"; break;
        case 6: pwVar5 = L"snd_cascade5"; break;
        default: pwVar5 = L"snd_cascade6";
      }
      Engine_PLAY_SOUND_4b38a0(pwVar5);
      ```

      `Battle.MatchResolved` carries that post-increment counter, which starts at 1
      for the first step, so in practice **step 1 is silent and step 2 plays
      `snd_cascade1`**. Seven or more keeps `snd_cascade6` rather than running off
      the end of the table.

      This is the kind of rule that is invisible until it is missing: a port that
      gave every match a noise would look and behave almost identically, and nothing
      in a screenshot or a log would show it.

      **Heroic effort plays two sounds, voice then effect**, in the same function:
      `snd_voice_heroiceffort` and then `snd_heroiceffort`. The battle end does the
      same shape - `snd_voice_victory` then `snd_victory`. That is why the port's
      event-to-sound mapping returns a *list*: most events play one, and a mapping
      that could only express one would have to drop either the voice or the effect.
    evidence:
      - kind: decompiled
        ref: docs/decompiled/mana_burn/Sub_47ae80.c
        quote: |
          case 1:
            goto switchD_0047ae9a_caseD_0;
          case 2:
            pwVar5 = L"snd_cascade1";
        note: the silent arms and the ladder of six
      - kind: decompiled
        ref: docs/decompiled/mana_burn/Sub_47ae80.c
        quote: |
          Engine_PLAY_SOUND_4b38a0(L"snd_voice_heroiceffort");
          Engine_PLAY_SOUND_4b38a0(L"snd_heroiceffort");
        note: heroic effort plays the voice line, then the effect
    affects: [gfx/sound_map.ml, test/test_gfx_sound_map.ml]
    notes: >
      Which sound a *spell* plays is **not** recovered. The registry names six
      spell sounds - nature, buff, debuff, fire, heal, alter - and the choice depends
      on what the spell does, which is not in this project. `Sound_map.spell_sound`
      guesses by whether the spell costs mana and is recorded as a guess; see
      `port.spell_sound_is_guessed`.

