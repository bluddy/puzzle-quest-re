  - id: mana.temp_resistance
    title: ADD_TEMP_RESISTANCE accumulates into four ints at character+0x94
    area: mana
    verdict: mechanic
    status: recovered
    confidence: high
    source_pass: spell_effects
    summary: >
      A bare accumulate with no clamp and no expiry of its own. It is a real
      field rather than a status effect because GET_RESISTANCE is a separate Lua
      API that other content reads. SSAN is the only script that sets it: five
