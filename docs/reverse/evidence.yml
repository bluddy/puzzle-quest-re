  # -------------------------------------------------------------- spells ----

  - id: spells.castspell.coverage
    title: All 129 battle spells have a ported CastSpell body
    area: spells
    verdict: mechanic
    status: recovered
    confidence: high
    source_pass: spell_effects
    summary: >
      SARC is excluded: it is the spell-research mini-game descriptor rather than
      a battle spell. Counted two ways, against the dispatch table and against the
      real spell table, so a body registered under an id no spell uses cannot
      read as progress.
    evidence:
      - kind: code
        ref: lib/spell_effects.ml
        note: effect_of_spell_ids
      - kind: code
        ref: test/test_spell_effects.ml
    affects: [lib/spell_effects.ml]

  - id: spells.ai.coverage
    title: All 129 ShouldAICastSpell hooks are ported
    area: spells
    verdict: mechanic
    status: recovered
    confidence: high
    source_pass: spell_effects
    summary: >
      53 generated by tools/extract_spell_ai.ps1, 76 hand-written. SCHG and SFBA
      were the last two and were long recorded as unobtainable; both helpers are
      local functions in the spells' own scripts.
    evidence:
      - kind: code
        ref: lib/spell_ai_manual.ml
      - kind: lua
        ref: game/Assets.zip!Assets/Spells/SCHG.lua
        note: EvaluateRows is ten lines below CastSpell
    affects: [lib/spell_ai.ml, lib/spell_ai_manual.ml]

  - id: spells.ai_returns_number
    title: A ShouldAICastSpell hook returns a number; > 0 means cast
    area: spells
    verdict: mechanic
    status: recovered
    confidence: high
    source_pass: original_reverse
    summary: >
      Not a boolean. Std_AISpellcastingChance returns 0 or 1 and three hooks
      return negatives (SMBU -50, SSBL and SSTL -10), which are suppressions.
    evidence:
      - kind: code
        ref: lib/spell.ml
        note: should_ai_cast
    affects: [lib/spell.ml, lib/spell_ai_manual.ml]

  - id: spells.ai_modifier_direction
    title: A positive modifier makes a spell cast MORE often
    area: spells
    verdict: mechanic
    status: recovered
    confidence: high
    source_pass: spell_effects
    summary: >
      The percentile roll is 0..99 with low being the lucky end, and the shared
      helper casts when `percentile <= 50 + modifier`. The port's prose said the
      opposite in three places while the code was right. The two numbers are easy
      to conflate: the hook's return value, where > 0 means yes and a negative is
      a suppression, and the modifier, where the sign runs the other way.
    evidence:
      - kind: code
        ref: lib/spell.ml
        quote: |
          let ai_spellcasting_chance ~(modifier : float) (ctx : ai_context) : bool =
            if float_of_int ctx.ctx_percentile > 50.0 +. modifier then false
            else ctx.ctx_evaluation <= 30
    affects: [lib/spell.ml, lib/spell_ai_manual.ml]

  - id: spells.handle_spell_cost
    title: HANDLE_SPELL_COST subtracts the spell's own cost and sets a flag
    area: spells
    verdict: mechanic
    status: recovered
    confidence: high
    source_pass: original_reverse
    summary: >
      Floors at zero and sets the spell's cost_charged flag, which suppresses the
      normal charge. Ten spells open with "Charge the mana first"; paying first
      would charge SIST's 60 mana twice, and 120 is not a number the game could
      intend.
    evidence:
      - kind: decompiled
        ref: docs/decompiled/Engine_HANDLE_SPELL_COST_4622c0.c
    affects: [lib/battle.ml, lib/spell_effects.ml]

  - id: spells.notify_of_free_spell
    title: NOTIFY_OF_FREE_SPELL sets one byte at +0x14, making the next spell free
    area: spells
    verdict: mechanic
    status: recovered
    confidence: high
    source_pass: spell_effects
    summary: >
      A latch on the combatant, not a modifier on the spell, and read *before* the
      body runs - so a body that sets it is granting the spell after this one.
      Separate from cost_charged, which a spell sets by paying for itself.
    evidence:
      - kind: decompiled
        ref: docs/decompiled/Lua_NOTIFY_OF_FREE_SPELL.c
        fn: Lua_NOTIFY_OF_FREE_SPELL
        quote: |
          iVar1 = Engine_HANDLE_SPELL_COST_4622c0();
          iVar1[0x14] = 1;
    affects: [lib/combat.ml, lib/battle.ml, lib/spell_effects.ml]

  - id: spells.swop_computes_damage_it_never_spends
    title: SWOP computes 5 + Fire/8 and deals no damage
    area: spells
    verdict: mechanic
    status: recovered
    confidence: high
    source_pass: spell_effects
