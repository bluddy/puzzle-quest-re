    affects: [lib/spell_effects.ml]

  - id: pres.add_effect_to_character
    title: ADD_EFFECT_TO_CHARACTER is a sparkle on a character
    area: render
    verdict: presentation
    status: recovered
    confidence: high
    audited: true
    source_pass: spell_effects
    summary: >
