    summary: >
      Map visibility is not a property of the road record but of its two nodes:
      revealing a location walks the roads touching it and re-decides each one from
      the other endpoint's flag, and hiding is unconditional. That is what makes a
      quest reveal open a route rather than repaint every road on the map. The port
      keeps node and road flags in mutable tables so the rule can be applied to the
