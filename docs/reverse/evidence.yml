  - id: pres.float_text_anchors_on_min_corner
    title: Float text anchors on its box's smaller corner, then clamps to the screen - and the vertical rule ignores the text's height
    area: ui
    verdict: presentation
    status: recovered
    confidence: high
    audited: true
    source_pass: font_pass
    summary: >
      The positioning in `Engine_ADD_TEXT_MESSAGE_415120`, with its two measurement
      calls now resolved (see `font.string_height_is_stored` and
      `font.glyph_advance_is_stored`):

      1. `x = min(x0, x1) - width / 2`, and likewise for y. It takes the **smaller**
         of each pair of corners and uses the larger only to establish which is
         smaller - it does not centre on the box's midpoint. The division truncates,
         so an odd width loses half a pixel.
      2. If the text would reach within **20px** (`0x14`) of the right edge it is
         shifted left by the overhang; if it starts left of the margin it is shifted
         right to the margin. **The near-edge test overrides the far-edge one**,
         because the second `if` assigns to the same variable the first did.
      3. **The vertical rule tests `y` against the bottom margin but never
         `y + height`,** while the horizontal rule tests `x + width`. So a message
         whose bottom edge runs off the screen is not pulled back.

      This is transcribed in `gfx/font_layout.place_message` and pinned by
      test_gfx_font_layout, including the asymmetry and the override.

      **Correction to `pres.add_text_message`.** That claim describes the
      positioning as "centre it, then keep it on screen" and cites
      `width_of_line + DAT_0059a4c8 / 2` centring against a global screen width.
      That is a *different* path. This function centres on the box's minimum corner
      and clamps; the other centres on the screen width. Reading them as one rule is
      what produced a midpoint assertion in a test, which failed.
    evidence:
      - kind: decompiled
        ref: docs/decompiled/Engine_ADD_TEXT_MESSAGE_415120.c
        quote: |
          iVar3 = param_4;
          if (param_6 <= param_4) { iVar3 = param_6; }
          sVar6 = (short)iVar3 - sVar1 / 2;                    // min corner, minus half width
          if (DAT_0059a4c8 + -0x14 <= iVar10 + iVar3) { ... }  // 20px, and x + width
          if (DAT_0059a4ca + -0x14 <= iVar3) { ... }           // 20px, but y alone
          if (sVar6 < 0x14) { iVar9 = 0x14 - iVar10; }         // overrides
        note: 'sVar1/2 is a truncating divide, and the vertical test omits the height'
      - kind: decompiled
        ref: docs/decompiled/font/FloatText_draw_centred_FUN_004c6b10.c
        quote: 'FUN_004c9950(..., (int)(short)(param_2 - (sVar1 >> 1)), (int)param_3, ...)'
        note: the same half-width shift on the other centring entry point
    affects: [gfx/font_layout.ml, test/test_gfx_font_layout.ml]
    notes: >
      The two globals are the screen dimensions: DAT_0059a4c8 is the width and
      DAT_0059a4ca the height, and neither value has been read out of .data. The
      original then writes the shift into four fields of the message's rectangle and
      copies two over the other two; that copy is a property of its data structure,
      not of the layout, so the port returns a resolved box instead.

  - id: skin.bitmap_registry
    title: Assets/Assets.xml is a registry of 44 sheets and 422 named rectangles, and it is the decoration vocabulary
    area: render
    verdict: presentation
    status: recovered
    confidence: high
    audited: true
    source_pass: decoration_pass
    summary: >
      The registry has two halves: `<Bitmap tag=...>path</Bitmap>` for 44 sheets,
      and `<BitmapImage tag=... bitmap=... x y width height destwidth destheight/>`
      for 422 named rectangles inside them. Those 422 are the game's whole
      decoration vocabulary - backdrop, border, selection glow, turn-counter
      plates, button states, dialog furniture - so a renderer should look tags up
      rather than carry coordinates of its own.

      Three things it settled that guessing would have got wrong:

      - **The screen is 1024x768.** `Assets/Screens/Backdrop.xml` declares a
        1024x768 menu, and the four border frames tile that rectangle exactly:
        top 1024x95 at (0,0), left 19x653 at (0,95), right 21x653 at (1003,95),
        bottom 1024x20 at (0,748) - 95+653 = 748, 748+20 = 768, and 19+21+1003 =
        1024. The window size is therefore recovered, not chosen.
      - **The backdrop is a JPEG**, and the sheet the registry names is
        `Skin_Backdrop_Standard.jpg`, not `Skin_Backdrop_Battle.jpg`. The latter
        appears in the archive and is mentioned nowhere in `Assets.xml`; this
        repository was extracting it until the registry was read.
      - **Frames carry a destination size as well as a stored size.** The red glows
        are 88x88 on disk and 64x64 on screen, so drawing one at its stored size is
        wrong, and the registry is the only place that says so.

      The gem frames are in this table too, which is why `gfx/assets.ml` looks them
      up instead of transcribing them: a rectangle nothing can check is a
      rectangle that is wrong by a pixel and looks fine.
    evidence:
      - kind: xml
        ref: game/Assets.zip!Assets/Assets.xml
        quote: '<BitmapImage tag="img_border_top" bitmap="bmp_skin_backdrop" x="0" y="0" width="1024" height="95" destwidth="1024" destheight="95"/>'
      - kind: xml
        ref: game/Assets.zip!Assets/Screens/Backdrop.xml
        quote: '<Menu x="0" y="0" width="1024" height="768" timer="on" draw="off" modal="off">'
      - kind: xml
        ref: game/Assets.zip!Assets/Assets.xml
        quote: '<Bitmap tag="bmp_skin_backdrop" precache="1">Assets\Skin\Skin_Backdrop_Standard.jpg</Bitmap>'
      - kind: xml
        ref: game/Assets.zip!Assets/Assets.xml
        note: img_redglow_00 is width 88 destwidth 64 - stored larger than drawn
    affects: [lib/skin_data.ml, gfx/skin.ml, gfx/assets.ml, gfx/layout.ml, bin/pq_play_gfx.ml, tools/extract_skin_data.py]
    notes: >
      Paths in the registry use backslashes and carry no extension, while the zip
      uses forward slashes and the decoder needs the extension - so both are
      normalised on the way in rather than at each use.

      `img_timer_0..5` (the hourglass) and `img_shieldgrn_*`/`img_shieldred_*` are
      identified and deliberately undrawn: the first belongs to the timed minigames,
      and the port has no mechanic the second would report. Both are recorded here
      so they are not mistaken for oversights.

  - id: skin.jpeg_needs_imagelib_fork
