  - id: board.flag_skull_scaling
    title: Board flag +0x392 suppresses damage scaling in the damage readout
    area: board
    verdict: mechanic
    status: recovered
    confidence: high
    source_pass: original_reverse
    summary: >
      The consumer exists and was found by scanning the binary for reads of the
      offset rather than by reading decompilation, which never captured one. At
      0x0047d24d the flag is loaded and tested; when it is zero the routine
      substitutes the raw unscaled value into five message slots, and when it is
      set it leaves the scaled value in place. The surrounding code builds
      `100 + x * factor * 0.01` percentages (the two float constants it uses are
      0.01 at 0x0051e4c8 and 100.0 at 0x005217b4), so the flag decides whether
      the number shown to the player is the multiplied one or the true one.

      This is why 38 spell bodies wrap their board rewrite in
      `SetMultiplierEffects(false)` ... `SetMultiplierEffects(true)`: the player
      sees honest numbers while a spell resolves.
    evidence:
      - kind: lua
        ref: game/Assets.zip!Assets/Scripts/GridUtilities.lua
        note: SetMultiplierEffects - the script-side view of the flag
      - kind: binary
        ref: game/Puzzle Quest.unpacked.exe
        note: >
          0x0047d24d `mov al, byte ptr [ebx + 0x392]` / `test al, al` /
          `jne 0x47d281`. The fall-through at 0x0047d265-0x0047d27d copies the
          unscaled float into [esp+0x28], [esp+0x30], [esp+0x34], [esp+0x38] and
          [esp+0x3c]; the scaled value was already stored to [esp+0x3c] above.
          Found with tools/scan_field_refs.py 0x392.
      - kind: code
        ref: tools/scan_field_refs.py
        note: reproduces the scan; without skipdata it reports a false negative
    affects: [lib/board.ml, lib/spell.ml, lib/battle.ml]

