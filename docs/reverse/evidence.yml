  - id: pres.text_queue_is_utf16_bgra
    title: Text is queued as UTF-16, coloured B,G,R,A, with an optional per-character colour
    area: render
    verdict: presentation
    status: recovered
    confidence: high
    audited: true
    source_pass: font_pass
    summary: >
      `FUN_004c9950` is the call the float-text entry points make. It stores the
      string with `wcsncpy` capped at 0xff characters, into a fixed ring of at most
      **100 queued strings** (0x314 bytes each, and `if (99 < slot) return -1`),
      and takes the text's colour from the font record at +0x28, +0x29, +0x2a -
      **B, G, R in that order** - overridable per call, with a fourth byte for
      alpha modulated as `byte(+0x2b) * param / 0xff`.

      Two things the port does not yet have, recorded so they are not discovered
      twice: the default colour comes from the font record rather than from the
      caller, which is why the colour lives in `Font.xml`; and there is an optional
      **per-character colour array**, one byte per character, which is how the
      original draws a single number in more than one colour.
    evidence:
      - kind: decompiled
        ref: docs/decompiled/font/Font_queue_text_FUN_004c9950.c
        quote: |
          *(char *)(*(short *)(param_1 + 0x1c) * 0x314 + 0x22c + param_1) =
