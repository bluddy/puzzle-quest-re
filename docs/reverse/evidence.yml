  - id: mana.temp_skill_writes_the_skill_array
    title: ADD_TEMP_SKILL writes a per-skill accumulator on the registry slot and moves the elemental ceilings with it
    area: mana
    verdict: mechanic
    status: recovered
    confidence: high
    source_pass: item_hooks
    summary: >
      The Lua binding reads the three arguments, caps the increment so the
      result cannot pass 999, and adds it into a per-skill accumulator on the
      character's registry slot at record[skillIdx*4 + 0x68] (decompiler units:
      piVar5[skillIdx + 0x1a]). This is separate from the raw skill array at
      char+0x48: the kind-5 effective-skill query reads the raw skill, folds
      the item and status OnQuerySkill hooks, and then adds the accumulator.
      For an elemental skill ADD_TEMP_SKILL then recomputes that element's
      ceiling as old_ceiling + (base(new) - base(old)), where base is
      25 + (effective + 1) / 2 via 0x478620's case 3, and moves the pool by
      the same delta through the setter at 0x4839f0. A skill-6 (morale) change
      also moves life and max life by the delta of case 7, floor(3 * skill / 2),
      through ADD_LIFE (0x445c40, clamped at the old max, any sign) and then
      ADD_MAX_LIFE (0x445c80) - life first, then the max, the order at 0x48c608.

    evidence:
      - kind: decompiled
        ref: docs/decompiled/Lua_ADD_TEMP_SKILL.c
        note: the 999 cap, the accumulator write at +0x1a (= record+0x68), and the ceiling delta
      - kind: decompiled
        ref: docs/decompiled/Engine_ADD_TEMP_SKILL_478620.c
        note: the derived-stat switch, case 3 returning (param_2 + 1) / 2
      - kind: decompiled
        ref: docs/decompiled/Engine_ADD_TEMP_SKILL_4839f0.c
        note: the setter that writes the ceiling at +0x84 and clamps the pool to it
      - kind: binary
        ref: game/Puzzle Quest.unpacked.exe
        note: >
          0x48c5ba writes the accumulator (mov [edi+esi*4+0x68], ecx); the
          kind-5 query at 0x4668dc reads it (add edi, [eax+ecx*4+0x68]) after
          folding the item and status OnQuerySkill hooks
      - kind: code
        ref: lib/spell_effects.ml
        note: add_temp_skill caps the increment at 999 effective, writes temp_skills, moves the ceiling through set_max_mana, and moves life/max on Morale
      - kind: code
        ref: lib/battle.ml
        note: skill_value is the kind-5 fold (items, statuses, accumulator) over all seven skills; the effect context carries it as fx_effective_skill
      - kind: code
        ref: lib/item_hooks.ml
        note: IGSH and IGPK read it the same way
    affects: [lib/combat.ml, lib/item_hooks.ml, lib/spell.ml, lib/battle.ml, lib/spell_effects.ml, lib/campaign.ml]
    notes: >
      This is what retired the "ADD_TEMP_SKILL stages a bonus" reading the item
      header carried: staging would mean a bonus applied later, and the write is
      right there in the binding. The accumulator is separate from the raw skill
      at char+0x48: the effective-skill query adds it after folding the item and
      status OnQuerySkill hooks, so a multiplicative hook like Fear sees the raw
      skill rather than raw-plus-temp. The port models this with
      Combat.combatant.temp_skills, and add_temp_skill now also makes the
      ceiling and life moves: the ceiling keeps its SET_MAX_MANA offset and the
      pool is clamped by set_max_mana, the increment stops at 999 effective
      (GET_SKILL's own clamp), and a Morale delta moves life clamped at the old
      max before the max itself.

