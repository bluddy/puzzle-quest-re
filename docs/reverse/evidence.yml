# Reverse-engineering evidence database.
#
# What this is for: every claim the port rests on, with the evidence it rests on,
# and how sure we are. Before this file those three things lived apart - a claim
# in a source comment, the decompilation in docs/decompiled/, and the confidence
# in a hand-written table at the bottom of a markdown file. Nothing joined them,
# so nothing could be queried and nothing could be checked.
#
# Two failures in the port would have been caught by this file existing:
#
#   * Status effects were keyed by their Lua table name rather than their XML id,
#     in the spell layer and in seven AI hooks. The claim lived in a comment; the
#     constants that contradict it lived in Assets.zip; nothing joined them.
#   * The status effect expiry rule was inverted, and two tests asserted the wrong
#     behaviour. A claim with a confidence and no evidence is what let that
#     harden.
#
# Format notes:
#   * evidence[].ref is a repo-relative path and is checked by
#     tools/validate_evidence.py. A claim cannot cite a file that is not there.
#   * Assets paths are cited as game/Assets.zip!Assets/... because that is where
#     they actually live; the validator understands that prefix and looks inside.
#   * `verdict: presentation` claims are the ones dropped from the port. They all
#     carry `audited`, and an unaudited one is an unproven assumption. Count them
#     with tools/validate_evidence.py --report.
#
# Conventions:
#   area      where the claim lives
#   verdict   mechanic   wrong if you get it wrong; the simulation is wrong
#             presentation  cosmetic; safe to drop, but only if that is proven
#   status    recovered  read directly out of the binary or the assets
#             inferred    reasoned from recovered facts, not itself read
#             assumed     a choice, with no evidence behind it
#             refuted     evidence says otherwise; kept so it is not re-derived
#             open        not known
#   confidence high | medium | low
#   audited   (presentation only) true if the call was actually decompiled
#   source_pass  which body of work established it, so a stale claim is visible

schema: 1

claims:

  # ---------------------------------------------------------------- mana ----

  - id: mana.pool_and_ceiling_offsets
    title: Mana pool at character+0x74, per-element ceiling at +0x84
    area: mana
    verdict: mechanic
    status: recovered
    confidence: high
    source_pass: mana
    summary: >
      Four consecutive ints per character hold the current pools, and four more
      hold the ceilings. The element index is the Lua mana id, which is the
      board's gem order (1 Earth, 2 Fire, 3 Water, 4 Air) and not `element`'s
      order - that transposition is the standing trap in this area.
    evidence:
      - kind: decompiled
        ref: docs/decompiled/Engine_SET_MANA_AIR_445c00.c
        fn: Engine_SET_MANA_AIR_445c00
        quote: |
          iVar1 = *(int *)(param_1 + 0x84 + param_2 * 4);
          if (param_3 < iVar1) { iVar1 = param_3; }
          *(int *)(param_1 + 0x74 + param_2 * 4) = iVar1;
    affects: [lib/combat.ml, lib/spell.ml]
    notes: See combat.resistance for the same transposition done once, in one place.

  - id: mana.set_clamps_to_ceiling
    title: SET_MANA_<E> stores the smaller of the requested value and the ceiling
    area: mana
    verdict: mechanic
    status: recovered
    confidence: high
    source_pass: mana
    summary: >
      A spell can ask for more mana than the pool holds and gets the ceiling
      instead. Several scripts rely on this, and `Battle.credit_run` depends on
      the consequence: a pool can never exceed its cap, which is what makes the
      AI's "is the pool full" test mean anything.
    evidence:
      - kind: decompiled
        ref: docs/decompiled/Engine_SET_MANA_AIR_445c00.c
        fn: Engine_SET_MANA_AIR_445c00
      - kind: code
        ref: lib/combat.ml
        note: Combat.set_mana
    affects: [lib/combat.ml, lib/spell_effects.ml]

  - id: mana.ceiling.only_written_by_set_max
    title: Inside a battle, the only writer of the ceiling is SET_MAX_MANA_<E>
    area: mana
    verdict: mechanic
    status: recovered
    confidence: high
    source_pass: status_effects
    summary: >
      SET_MAX_MANA_AIR resolves its arguments and writes +0x84 directly, with no
      clamping. A scan of all 346 decompiled files finds no other writer of that
      field on a battle character apart from the tutorial monster spawn. The one
      script that calls it is SLCO, which raises the Fire ceiling by twelve.

      So the ceiling does not move on levelling during a battle. Something
      establishes the base when the hero is constructed or loaded, and that is
      open - see mana.ceiling.base_value.

      Strengthened from a decompilation scan to a machine-code scan. Of the 244
      instructions in the binary that reference +0x84, only **three** touch it in
      the element-indexed form this field actually has, and all three are already

      tools/scan_field_refs.py reaches. The filter that makes this hold is the
      access *shape* (see the trap list in docs/reverse/README.md): a common
      offset is tractable only once you require the shape the field actually
      has.
    evidence:
      - kind: decompiled
        ref: docs/decompiled/Lua_SET_MAX_MANA_AIR.c
        fn: Lua_SET_MAX_MANA_AIR
        quote: |
          Engine_ADD_TEMP_SKILL_4839f0(2,uVar3);   // misnamed; writes +0x84
      - kind: decompiled
        ref: docs/decompiled/Engine_ADD_TEMP_SKILL_4839f0.c
        quote: |
          *(int *)(param_1 + 0x84 + param_2 * 4) = param_3;
      - kind: binary
        ref: game/Puzzle Quest.unpacked.exe
        note: >
          0x004839f0 stores the new ceiling unconditionally, then clamps the pool
          to it - `mov [esi+ecx*4+0x84], eax` / `cmp edx, eax` /
          `mov [esi+ecx*4+0x74], eax`. That clamp is why lowering a ceiling
          destroys held mana, which is what lib/combat.ml set_max_mana implements.
      - kind: lua
        ref: game/Assets.zip!Assets/Spells/SLCO.lua
    affects: [lib/combat.ml, lib/spell_effects.ml]
    notes: >
      The decompiler reuses ADD_TEMP_SKILL_4839f0 as the symbol here and there.
      It is a dispatch helper, not the skill function. Several other .c files in
      docs/decompiled carry the same misnaming, which is a standing trap when
      reading a quote without its caller.

  - id: scripts.std_helpers_read_from_source
    title: The whole Std_* library is one 9KB file, and it is thin
    area: spells
    verdict: mechanic
    status: recovered
    confidence: high
    source_pass: original_reverse
    summary: >
      `Assets/Scripts/StandardUtilityScripts.lua` holds all 19 `Std_*` helpers -
      `Std_GetDifficulty`, `Std_InflictDamage`, `Std_Healing`, the status-effect
      pair, the gold pair, the spell-effect lookups, `Std_AISpellcastingChance`.
      `Assets/Scripts/` contains only five files in total, so this and
      `StandardConstants.lua` were the last unexamined assets of any size.

      Every one of them is a thin wrapper: `Std_InflictDamage(amt, src)` is
      `SUBTRACT_LIFE(GET_ENEMY(src,0), amt, src)` plus a sound and a text
      message. The amount arrives as a parameter, so {e no} damage formula is in
      Lua - which agrees with the `+0x392` consumer living in native code.

      Two details that must not be tidied up. The singular/plural message split
      is `amt < 2` in `Std_InflictDamage` but `amt == 1` in `Std_Healing`, so the
      original is genuinely inconsistent and damage of 0 reads as singular while
      healing of 0 reads as plural. And `Std_GainGold`/`Std_LoseGold` take a
      combatant index directly, whereas damage, healing and status effects all
      resolve their target with `GET_ENEMY(src, 0)` - so gold is handed to a named
      combatant while damage is aimed at "the enemy of whoever cast it".
    evidence:
      - kind: lua
        ref: game/Assets.zip!Assets/Scripts/StandardUtilityScripts.lua
      - kind: lua
        ref: game/Assets.zip!Assets/Scripts/StandardConstants.lua
        note: |
          Contains exactly IsWildcard and IsSkull - the two predicates, and the
          answer to where the IsWildcard that SWMG calls is defined.
      - kind: code
        ref: lib/spell.ml
        note: |
          difficulty_for_levels, checked against the source and matching all four
          band boundaries and their strict comparisons exactly.
    affects: [lib/spell.ml, lib/spell_effects.ml, lib/combat.ml]

  - id: mana.save_stores_the_pool_not_the_ceiling
    title: The mana quadruple in a save is the pool; no ceiling is stored at all
    area: save
    verdict: mechanic
    status: recovered
    confidence: high
    source_pass: original_reverse
    summary: >
      Settled empirically rather than by disassembly. Four real .pqhero files were
      decoded with bin/pq_save_tool.exe, which already implements the payload
      decryption, and their reserves are:

      | hero | class | level | air | earth | fire | water |
      | --- | --- | --- | --- | --- | --- | --- |
      | Vanoton | PDRU | 1 | 1 | 1 | 1 | 1 |
      | quton | PWIZ | 1 | 10 | 10 | 7 | 7 |
      | Jusdor | PDRU | 5 | 30 | 7 | 31 | 3 |
      | Forton | PWIZ | 7 | 6 | 1 | 4 | 20 |

      A fresh level-1 druid holds 1 in every element and a level-5 druid holds 31
      Fire, so the field tracks what the player has banked rather than any
      maximum - it is the pool. No ceiling is stored anywhere in the file.

      This has a consequence the port must respect: Jusdor legitimately holds 31
      Fire at level 5, so [mana.ceiling.base_value]'s 20 is too low to be a real
      character's ceiling. Clamping a loaded save to that default would destroy
      11 points of a real hero's mana. There is no save-to-combatant path yet, so
      nothing is broken today, but lib/combat.ml now says so at the constant.
    evidence:
      - kind: code
        ref: bin/pq_save_tool.ml
        note: run against four real .pqhero files; all four parse and decrypt cleanly
      - kind: code
        ref: lib/combat.ml
        note: default_mana_limit, with the load constraint recorded
      - kind: doc
        ref: docs/SAVE_FILE_FORMAT.md
    affects: [lib/combat.ml, lib/save_file.ml, bin/pq_save_tool.ml]

  - id: save.header_layout_verified
    title: The .pqhero header is plaintext and carries per-hero name, class and level
    area: save
    verdict: mechanic
    status: recovered
    confidence: high
    source_pass: original_reverse
    summary: >
      `RGMH` magic, version 1, then a fixed 0x2028-byte header with the embedded
      portrait PNG starting immediately after it, a GUID, and the app name
      "Uzzle Quest" in UTF-16. Hero summaries sit in 0x800-byte slots as UTF-16
      "Name - Class (Level N)" - which is how the four heroes were identified as
      Wizard L7, Druid L5, Wizard L1 and Druid L1 without touching the encrypted
      body.

      The body after the PNG is encrypted, not merely compressed: 7.5-7.75
      bits/byte, and no standard codec (zlib, raw deflate, gzip, bz2, lzma)
      matches at any offset. lib/crypto.ml already implements the payload
      transform, so this is a confirmation rather than a new capability.

      The level-and-class pairing matters beyond the format: it confirms the save
      carries both, which is the premise the level-derived ceiling hypothesis
      needs.
    evidence:
      - kind: code
        ref: lib/save_file.ml
        note: header parse, cross-checked byte-for-byte against four real files
      - kind: doc
        ref: docs/SAVE_FILE_FORMAT.md
    affects: [lib/save_file.ml, lib/crypto.ml]

  - id: professions.contain_no_mana_data
    title: Profession XML has no mana ceiling, so the ceiling is not class data
    area: save
    verdict: mechanic
    status: recovered
    confidence: high
    source_pass: original_reverse
    summary: >
      All four profession files - PDRU, PKNI, PWAR, PWIZ - contain exactly the tags
      Profession, Text, Portraits, Portrait, Skill, Start, Campaign, Level, Sprite,
      XP and Spell, and the string "mana" appears in none of them. They hold
      starting skill levels, starting allocations and gold, the campaign city, life
      per level, the XP table, and a level-to-spell table.

      So the per-element ceiling is not class data. Combined with
      SET_MAX_MANA being called once in the whole game and no ceiling being stored
      in the save, the base value has to be computed in native code at load or
      construction. That narrows quest.base_value_from_level considerably: it is
      not in the assets, not in the save, and not in the scripts.
    evidence:
      - kind: xml
        ref: game/Assets.zip!Assets/Professions/PWIZ.xml
      - kind: xml
        ref: game/Assets.zip!Assets/Professions/PDRU.xml
      - kind: xml
        ref: game/Assets.zip!Assets/Professions/PKNI.xml
      - kind: xml
        ref: game/Assets.zip!Assets/Professions/PWAR.xml
    affects: [lib/spell.ml, lib/combat.ml]

  - id: mana.ceiling.base_value
    title: The per-element mana ceiling is 25 + (effective skill + 1) / 2, computed at construction
    area: mana
    verdict: mechanic
    status: recovered
    confidence: high
    source_pass: mana
    summary: >
      The ceiling is neither stored nor chosen. The character constructor at
      0x4661f0 zeroes all four and then computes each one from the character's
      own skill for that element: ceiling = 25 + (effective skill + 1) / 2,
      where the half is 0x478620's case 3 - (v + 1) / 2 - and the 25 is also
      what the sibling constructor at 0x466060 writes flat to all four. An
      untrained character starts at 25 and every two points of mastery buy one
      point of ceiling.
      The other half of the derivation is confirmed from the opposite side:
      ADD_TEMP_SKILL moves a ceiling by the delta of the same expression (its
      call at 0x48c5d5), so a skill raise carries its ceilings with it, and the
      setter it calls - 0x4839f0 - is the only writer of the field anywhere in
      the image. Five sites call that setter in all: the four SET_MAX_MANA_*
      Lua bindings and ADD_TEMP_SKILL.
      What was still unread is now read (quest.base_value_from_level): the
      effective skill is the raw skill plus the equipped items' OnQuerySkill
      hooks plus the active status effects' OnQuerySkill hooks plus the
      temp-skill accumulator at record[skillIdx*4 + 0x68] - level does not fold
      in. The save carries the seven Masteries and no ceiling, so a loaded
      hero's ceiling recomputes from exactly this formula.
    evidence:
      - kind: binary
        ref: game/Puzzle Quest.unpacked.exe
        note: >
          the recursive-descent walk over 954,645 decoded instruction bytes:
          0x4661f0 computes each ceiling as 0x478620(3, vtable[0x20](5, skill,
          level, elem)) + 25, 0x466060 writes 25 flat, 0x48c5d5 moves one by the
          same delta, and those five sites are the setter's only callers
      - kind: decompiled
        ref: docs/decompiled/Engine_ADD_TEMP_SKILL_478620.c
        note: case 3 returning (param_2 + 1) / 2
      - kind: decompiled
        ref: docs/decompiled/Lua_ADD_TEMP_SKILL.c
        note: the same expression applied as a delta, under the 999 skill cap
      - kind: decompiled
        ref: docs/decompiled/Engine_ADD_TEMP_SKILL_4839f0.c
        note: the setter - store the ceiling, then clamp the pool down to it
      - kind: code
        ref: lib/combat.ml
        note: base_mana_limit, mana_limit_for_skill, caps_for, and the make_combatant default
      - kind: code
        ref: test/test_combat.ml
        note: the shape of the formula and the derived default on a combatant
      - kind: code
        ref: test/test_companion.ml
        note: a player's affinities reach the combatant with their ceilings
    affects: [lib/combat.ml, lib/campaign.ml, lib/spell.ml, lib/spell_ai_manual.ml]
    notes: >
      Supersedes this claim's earlier form, which called the base a chosen 20
      with confidence low - the constant was standing in for a derived one, and
      20 vs 25 matters for the AI's "pool is full" tests. It answers the
      constructive half of quest.base_value_from_level; the effective-skill
      query is now answered too (see that question's resolution): level does not
      fold in, and the decoded hero's 31 Fire is explained by training plus the
      temp-skill accumulator, not by level scaling.
  - id: mana.yield.formula
    title: Mana yield is (skill + 100) * run_multiplier * 0.01, capped at 999
    area: mana
    verdict: mechanic
    status: recovered
    confidence: high
    source_pass: original_reverse
    summary: >
      Established in the original pass from constants at 0x5217B4 and 0x51E4C8.
      The yield is a float in the original because the extra turn roll truncates
      it, and 10.99 versus 10 is observable.
    evidence:
      - kind: doc
        ref: docs/SPELLS.md
        note: section 3
    affects: [lib/spell.ml, lib/battle.ml]

  - id: mana.temp_resistance
    title: ADD_TEMP_RESISTANCE accumulates into four ints at character+0x94
    area: mana
    verdict: mechanic
    status: recovered
    confidence: high
    source_pass: spell_effects
    summary: >
      A bare accumulate with no clamp and no expiry of its own. It is a real
      field rather than a status effect because GET_RESISTANCE is a separate Lua
      API that other content reads. SSAN is the only script that sets it: five
      points to one of the four elements, drawn at random.
    evidence:
      - kind: decompiled
        ref: docs/decompiled/Lua_ADD_TEMP_RESISTANCE.c
        fn: Lua_ADD_TEMP_RESISTANCE
        quote: |
          piVar1 = (int *)(iVar5 + 0x94 + iVar2 * 4);
          *piVar1 = *piVar1 + iVar4;
    affects: [lib/combat.ml, lib/status_effect_hooks.ml]

  # ------------------------------------------------------- status effects ----

  - id: status.keyed_by_xml_id
    title: A status effect is identified by its XML id, never by its script name
    area: status_effects
    verdict: mechanic
    status: recovered
    confidence: high
    source_pass: status_effects
    summary: >
      STATUS_EFFECT_HIDDEN is a string alias for "EHID", and every
      HAS_STATUS_EFFECT and ADD_STATUS_EFFECT is a comparison against that
      string. The Lua table is called Hidden and nothing in the game ever
      compares a table name.

      The port had it wrong in the spell layer (storing "Hidden", "Poison",
      "Favoreded" and three spellings of Blind) and in seven AI hooks. With no
      descriptor table in place this was invisible; the moment one existed, all
      seventeen effects were inert.
    evidence:
      - kind: lua
        ref: game/Assets.zip!Assets/Scripts/StandardConstants.lua
        quote: |
          STATUS_EFFECT_HIDDEN 	= "EHID";
          STATUS_EFFECT_WALLOFFIRE	= "EWOF";
      - kind: xml
        ref: game/Assets.zip!Assets/StatusEffects/Hidden.xml
        note: id="EHID", duration="0", stack="1"
      - kind: code
        ref: lib/status_effect_data.ml
    affects: [lib/spell_effects.ml, lib/spell_ai_manual.ml, lib/status_effect_data.ml]

  - id: status.expiry.zero_is_alive
    title: The expiry countdown reports a duration at or below zero as ALIVE
    area: status_effects
    verdict: mechanic
    status: recovered
    confidence: high
    source_pass: status_effects
    summary: >
      FUN_00475220 reads `if (duration < 1) return 1`. The port had this
      inverted, which would have dropped the three indefinite effects on the turn
      they were applied. Two tests asserted the wrong behaviour, which is how it
      stayed wrong.
    evidence:
      - kind: doc
        ref: docs/COMBAT_FLOW.md
        note: section 3 quotes the recovered rule
      - kind: code
        ref: lib/combat.ml
        note: tick_duration
    affects: [lib/combat.ml, test/test_combat.ml]

  - id: status.cancel_by_setting_duration_to_one
    title: A self-cancelling effect sets its own remaining duration to 1
    area: status_effects
    verdict: mechanic
    status: recovered
    confidence: high
    source_pass: status_effects
    summary: >
      Three scripts cancel themselves this way - Hidden when its owner is hit,
      Wall of Fire and Wall of Thorns when their pool empties. It is not a
      removal: the effect keeps working for the rest of the turn in which it
      cancelled itself, and the next countdown drops it. The asymmetry matters -
      a wall broken by damage mid-turn survives to the tick, and a wall broken by
      its own start-turn hook is gone before the turn begins.
    evidence:
      - kind: lua
        ref: game/Assets.zip!Assets/StatusEffects/Hidden.lua
        quote: |
          local idx = GET_STATUS_EFFECT_INDEX(targetIdx,STATUS_EFFECT_HIDDEN);
          SET_STATUS_EFFECT_DURATION(targetIdx,idx,1);
      - kind: code
        ref: lib/combat.ml
        note: set_effect_duration
    affects: [lib/combat.ml, lib/status_effect_hooks.ml]

  - id: status.walls_bleed_two_per_turn
    title: Wall of Fire and Wall of Thorns cost two of their pool a turn to stand
    area: status_effects
    verdict: mechanic
    status: recovered
    confidence: high
    source_pass: status_effects
    summary: >
      Easy to miss because the script lists OnReceiveDamage first and
      OnStartTurn second. A wall written without the start-turn half is free to
      stand indefinitely, which is exactly what the first pass produced. Caught
      by the new suite.
    evidence:
      - kind: lua
        ref: game/Assets.zip!Assets/StatusEffects/WallOfFired.lua
        quote: |
          local function OnStartTurn(characterIdx,turnNumber)
              SUBTRACT_MANA_FIRE(characterIdx,2);
              if (GET_MANA_FIRE(characterIdx) <= 0) then ... end
          end
    affects: [lib/status_effect_hooks.ml]

  - id: status.scripts_count
    title: The base game ships 17 status effect scripts
    area: status_effects
    verdict: mechanic
    status: recovered
    confidence: high
    source_pass: status_effects
    summary: All 17 are ported; none was left unported.
    evidence:
      - kind: decompiled
        ref: docs/decompiled/status_effects
      - kind: code
        ref: lib/status_effect_hooks.ml
