  - id: campaign.fog_of_war
    title: There is no hero-position reveal - visibility has exactly three writers and none is the map
    area: campaign
    verdict: mechanic
    status: recovered
    confidence: high
    summary: >
      The game has no fog-of-war radius. A full .text scan for byte writes to
      the node-visible fields (+0x458 on cities, +0x454 on waypoints; stack
      spills at the same displacements excluded) finds exactly three
      functional writers: the XML loader (0x4426xx parses the initial
      yes-flag into the static records), QUEST_SET_VISIBILITY's engine body
      (0x450e40, writing the flag, mirroring it into the city-status record's
      byte 7, and re-deciding the touching roads under the both-endpoints
      rule), and the map-rebuild loop (0x4541xx) that restores flags from
      those saved city-status bytes over the static defaults. SET_VISIBILITY
      has exactly one caller - its Lua binding at 0x4948ae - so no engine
      path can reveal behind the quest scripts' backs, and the movement
      walker (0x44c9xx, reached from QUEST_MOVE) advances road by road
      touching only movement state (+0xc/+0x10/+0x230/+0x244): arrival
      reveals nothing. Ruin visibility is registry membership (0x450820
      walks the list at this+0x64), which the port already models as the
      ruin registry. The port's existing model - static initial set, quest
      reveals, the road rule, ruins through the registry, flags snapshotted
      in the save - is the whole mechanic, with no radius to recover.
