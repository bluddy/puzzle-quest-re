  - id: ai.difficulty_from_levels
    title: Std_GetDifficulty derives the difficulty band from the hero/task level gap
    area: spells
    verdict: mechanic
    status: refuted
    confidence: high
    source_pass: presentation_audit
    summary: >
      Five bands, not three. `Battle.rules.difficulty` was a hand-set field
      documented as "0 easy, 1 normal, 2+ hard", which was a guess at a value the
      game computes: an encounter's difficulty is the gap between the hero's level
      and the task's.

          taskLevel < heroLevel - 6   -> 0
          taskLevel < heroLevel - 1   -> 1
          taskLevel < heroLevel + 3   -> 2
          taskLevel < heroLevel + 8   -> 3
          otherwise                  -> 4

      Every comparison is strict, so for a hero of 10 the bands are task levels
      3 and below, 4-8, 9-12, 13-17, and 18 and above.

      This is the quest-to-battle bridge and the only thing that decides what
      `Battle.rules.difficulty` is. That value gates the AI's spell skip
      (`pick_ai_spell`, 50/25/0 percent by band) and the board evaluator's
      jitter, so getting it wrong makes every fight the wrong difficulty.

      Ported as `Spell.difficulty_for_levels`, and called for real by the
      campaign paths through `rules_for_battle` (campaign.battle_setup) - it
      sat without a caller until road and quest fights computed their rules
      from it. It lives in spell.ml rather than a quest module because there
      was no quest module when it was ported.
    evidence:
      - kind: lua
        ref: game/Assets.zip!Assets/Scripts/StandardUtilityScripts.lua
        quote: |
          function Std_GetDifficulty(heroLevel,taskLevel)
              if (taskLevel < heroLevel-6) then return 0;
              elseif (taskLevel < heroLevel-1) then return 1;
              elseif (taskLevel < heroLevel+3) then return 2;
              elseif (taskLevel < heroLevel+8) then return 3;
              end
              return 4;
          end
      - kind: code
        ref: lib/spell.ml
        note: difficulty_for_levels
    affects: [lib/spell.ml, lib/battle.ml]
    notes: >
      The transcription is right and the role is wrong: the function exists,
      is five bands as written, and decides nothing. Kept refuted so the
      bridge is not re-derived - see quest.difficulty_consumers for the audit
      and ai.difficulty_is_the_player_option for what the field really takes.
    resolution: >
      The band function is dead code. No `GetDifficulty` string exists in
      Assets.zip but its own definition, and the exe holds no such literal, so
      no script and no engine path can call it; meanwhile Battle.rules.difficulty
      is written from a registry option at battle start (0x44BB39 reads the
      global 0x4223C2 filled from Software\Infinite Interactive\Puzzle
      Quest\Difficulty), never from a level comparison. So the claim's two
      load-bearing parts fail together: nothing computes the band, and the
      band is not what decides the field.

      The port keeps the transcription (difficulty_for_levels) because the
      asset ships it, with the test that pins its boundaries as its only
      caller - the same dead state the original is in - and gets the value
      for a campaign fight from Campaign.difficulty instead.

