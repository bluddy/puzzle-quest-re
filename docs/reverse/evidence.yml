    resolution: >
      Audited 2026-10-04. None of them touches life, mana, gems or status effects.
      The one that needed no decompilation - the Std_* family - turned out to be
      Lua, and reading it also produced three new recovered claims and one new
      mechanic (Std_GetDifficulty).

  - id: quest.difficulty_consumers
    question: Where else does Std_GetDifficulty feed in besides the spell skip?
    why_it_matters: >
      It sets Battle.rules.difficulty, which gates pick_ai_spell's skip and the
      board evaluator's jitter. Both are ported, but the quest layer that would
      choose taskLevel does not exist yet, so nothing computes it in practice.
    would_be_settled_by:
      - The quest/task table, once extracted from Assets/Quests.
      - >
        Every reference to the difficulty field in the binary, or every caller
        of the band function.
    related: [ai.difficulty_from_levels, ai.difficulty_is_the_player_option,
              ai.query_difficulty_is_journal_text]
    notes: >
      The premise did not survive the audit: Std_GetDifficulty is not the
      thing that sets Battle.rules.difficulty, and the quest layer's own
      difficulty hook turns out to be journal text rather than a battle input.
    status: recovered
    resolution: >
      Nowhere, because it has no callers at all. The substring "GetDifficulty"
      occurs exactly once in Assets.zip - the definition in
      StandardUtilityScripts.lua - and nowhere in Puzzle Quest.unpacked.exe,
      so neither a script nor the engine can reach the band function; nothing
      computes a hero/task band anywhere in the shipped game.

      The quest layer does exist now, and all 142 quests export
      OnQueryDifficulty, but as a constant rating, not a task level: 114
      return 2, 15 return 1, 12 return 3 and one returns 0, and the bodies are
      five distinct "return n;" shapes and nothing else. It has exactly one
      consumer - index 13 of the query dispatcher at 0x4730f0 (the jump table
      at 0x473434), whose only caller passing 0x0D is 0x42AF8A - and that
      function switches 0..4 over a jump table at 0x42B340 to pick the
      [OPPDIFFICULTY0..4] / [DIFFICULTY_] widget strings, coloured green,
      blue, red and yellow: the opponent panel's difficulty pips. Presentation.

      What actually feeds Battle.rules.difficulty is the player's Difficulty
      option: m_difficulty (CBattleManager+0x48) is written by the singleton
      constructor (0x43F88D = 1), by FUN_004406F0's temporary 2 and restore
      (0x440742 / 0x440AC3), and at battle start by 0x44BB39 from global
      0x582454. That global has three code references, one of which is the
      writer: 0x4223C2 reads the registry value "Difficulty" under
      Software\Infinite Interactive\Puzzle Quest into it. The settings object
      holds Difficulty at +0x74 beside Time Limit at +0x70, defaults it to 1
      (0x43729E), writes it back at 0x436A34 and reads it at 0x4373D9; the
      single-player hero view's controls are drop_difficulty and
      drop_timelimit, whose rows are [AILEVEL0..2] ("Easy (-25% XP)",
      "Normal", "Hard (+25% XP)"). See ai.difficulty_is_the_player_option;
      the port now takes the value from Campaign.difficulty
      (port.difficulty_source).

  - id: xp.difficulty_scaling
    question: Where does the -/+25% XP the Difficulty option promises actually get applied?
    why_it_matters: >
      The three rows advertise the choice as an experience modifier - "Easy
      (-25% XP)" and "Hard (+25% XP)" against Normal - so a port that feeds
      difficulty only to the AI is leaving half the option unwired, and XP is
      what drives levels, training costs and the skill ladder.
    would_be_settled_by:
      - >
        A difficulty read inside an XP path: either in Engine_ADD_XP
        (0x42C030) or in whatever the results screen hands it.
      - >
        The meaning of turn_manager+0x30, which gates the only
        difficulty-scaled XP writer found so far.
    related: [ai.difficulty_is_the_player_option]
    notes: >
      Ruled out this round: Engine_ADD_XP routes its amount through the
      character's value query with kind 0xf, and that query's switch
      (0x46672A, cases for kinds 1..10) falls through to the default for 15,
      so no difficulty term sits in the XP write itself. The one place
      difficulty multiplies XP is FUN_0043E400 - the port's
      Score.compute_co_op_payout, (raw*3)/4 at 0 and (raw*5)/4 at 2, which is
      exactly the advertised -/+25% - called by the results screen at
      0x43E5F0 with (gold, xp) out-params that feed ADD_GOLD/ADD_XP. That call
      sits on the branch gated by turn_manager+0x30, which docs/BATTLE_SCORE.md
      labels co-op at medium confidence; the other branch feeds the same
      out-params zeros. So either the label is wrong and this is the
      single-player reward path, or Easy/Hard pays its XP only in a party -
      and the branch flag is what would tell them apart.
    status: open

  - id: quest.grid_patterns_unread
    question: What are the 4/5-of-a-kind pattern rules in GridPatterns.lua?
    why_it_matters: >
      10KB of Lua that has never been read. It is where +0x395's pattern matching
      is defined, and it is the largest single unread asset in the project.
    would_be_settled_by:
      - Reading game/Assets.zip!Assets/Scripts/GridPatterns.lua.
    related: [board.flag_pattern_45, board.grid_patterns_is_unused]
    status: refuted
    resolution: >
      The file has been read and it does not contain the 4/5-of-a-kind rules -
      none of its pattern helpers are called from anywhere in the game, so it is
      developer scaffolding rather than shipped content. That does not refute
      +0x395 itself, which stays inferred; it means this asset can no longer
      settle it, and the search has to move to the binary. See
      board.grid_patterns_is_unused.

  - id: asset.status_effect_id_mismatches
    question: Why does EFBO have no STATUS_EFFECT_ constant, and EDOO a constant with no XML?
    why_it_matters: >
      Benign so far - spells pass the raw string and the id is still the id - but
      it means the two tables are not redundant and neither can be generated from
      the other.
    would_be_settled_by:
      - Nothing further needed; recorded so it is not treated as a bug to fix.
    related: [status.keyed_by_xml_id]
    status: refuted
    resolution: >
      Not a defect. Spells pass the raw string and the id is still the id, so the
      two tables are complementary rather than redundant, and neither can be
      generated from the other.

  - id: font.advance_field_mapping
    question: What is the glyph field at +0x1c, and how does it relate to the table's leading and trailing?
    why_it_matters: >
      Every piece of text in the port is positioned with this. FUN_004c7650 sums
      +0x18 per character but adds +0x1c for the first character and subtracts it
      for the last, and for a single 'A' in Small those two branches disagree - 25
      against 10. One of them must be wrong, and until we know which, the port's
      measure is the ink width rather than the original's measurement.

      The visible consequence is small - text is laid out contiguously and centred
      on its own ink - but it means a string's measured width may differ from the
      original's by up to one bearing, which matters for anything that has to line
      up with the original's screen.
    would_be_settled_by:
      - >
        Reading the asset-build tool that writes these glyph records, which is not
        in this repository.
      - >
        Failing differently: measuring a known string in the original and comparing
        it against FUN_004c7650's prediction, which would say which branch is live.
    related: [font.glyph_advance_is_stored, font.glyph_tables_not_parsed_at_runtime]
    status: open

  - id: render.cascade_snapshots
    question: What is the cheapest honest way to animate a cascade - instrument Board, or replay the log?
    why_it_matters: >
      Gems currently teleport. Swap slide and cascade fall need the board as it
      was between cascade steps, and Battle.on_event reports *that* a step
      happened without saying what the board looked like afterwards. The engine
      assigns b.board <- ... in a handful of places, so an observer at each of
      them would be cheap - but it is instrumentation in code the tests pin, and
      the alternative (re-deriving intermediate states from the log) can drift
      from what the engine actually did, which is worse than no animation.
    would_be_settled_by:
      - >
        Deciding whether an observer at each board assignment is worth it, which
        depends on how the cascades actually look once stepped through.
    related: [pres.add_text_message]
    status: refuted
    resolution: >
      Neither option: the engine was not instrumented at its board assignments, and
      the log is not re-read. `Battle.step` carries the boards themselves - a swap's
      before and after, and for each cascade step the board as the player saw it, the
      same board with the matches gone and the gaps still open, and the board after
      gravity and refill - and `Battle.on_step` hands them over at the three points
      where they are produced.

      Three things made that the cheap option rather than the expensive one. The
      boards are persistent, so a snapshot is a reference and costs nothing. The
      match result already carried the run groupings, so the cleared board is the
      engine's own rather than a reconstruction. And the callback defaults to `None`
      and is one branch at each of those three points, so `test_battle` can assert
      that a watched battle and an unwatched one produce byte-identical logs.

      Re-deriving the states from the log was the option that lost: it can only ever
      guess what the engine did, and a cascade animation that is subtly wrong is
      worse than no cascade animation. See `port.animate_from_board_snapshots`.

  - id: spell.match_resolution_after_a_spell
    question: Does the engine resolve matches that a spell's own board edits create?
    why_it_matters: >
      A spell can put a gem on the board - `SBAC` drops a red skull, SWTD turns skulls
      red, `SCON` rewrites a whole kind - and any of those can complete a line of
      three. The port applies gravity and a refill after a cast but does not resolve
      matches, so a line made by a spell sits unresolved until the next swap, where
      it would be scored as part of whoever swapped next's cascade. That is a
      plausible reading and it is also possibly wrong, and the two differ in damage,
      mana and gold.

      This became reachable only when the cast path started writing the spell's board
      back to the battle (see `port.effect_context_is_written_back`). Before that a
      spell's board edits were discarded and the question could not arise, which is
      the reason it is being asked now rather than having been asked during the spell
      port.
    would_be_settled_by:
      - >
        Reading the engine's post-CastSpell board handling: whether the same
        resolve-and-cascade routine the swap path uses is invoked after a script's
        CastSpell returns.
      - >
        A save game where a spell completes a line, played through the original, and
        whether the cascade fires immediately or on the next move.
    related: [pres.add_effect_to_grid]
    status: open

  - id: spell.sfba_target_writeback
    question: How does SFBA's SET_INPUT_DATA target reach CastSpell?
    why_it_matters: >
      The scoring is ported; the write-back is not. In a headless port the target
      comes from the spell's input_type, which is the human's aim - correct for a
      player, wrong for an AI casting it.
    would_be_settled_by:
      - Deciding where an AI's chosen cell is meant to live.
    answer: >
      The cell lives on the ai_context as ctx_aim: each aiming hook writes it
      during pick_ai_spell, which clears the ref before every candidate, and
      take_action reads it into effect_context.fx_input after the spell is
      chosen - the same path the human's choose_aim takes. SFBA's own pick
      (GetRandomGrid_Type of a red skull, else a plain skull, else no cast)
      is ported with the other five; see spells.ai_aim.
    related: [spells.ai.coverage, spells.ai_aim]
    status: recovered

  - id: board.gem_id_air_water_order
    question: Are the gem ids 3 and 4 Air and Water, or Water and Air?
    why_it_matters: >
      docs/BATTLE_AI.md's table, read off the switch in CBoard_AccumulateGem,
      says 3 water and 4 air, and lib/ai.ml's gem_id follows it.
      Assets/Scripts/StandardConstants.lua says the opposite - GEM_AIR = 3,
      GEM_WATER = 4 - and spells compare GET_GEM against those names (SHGO,
      SSOA), so one of the two sources is wrong about the shipped game.
      Nothing observable turns on it today: ai.ml matches its ids against its
      own, the engine's grid never enters the port, and the matcher, the mana
      yield and the capture parser all work from constructors and characters
      rather than from ids. A reader that decoded a real grid would pick the
      wrong element for exactly one id, and two claims - board.gem_ids and the
      parenthetical in mana.pool_and_ceiling_offsets - currently state the
      decompile's order as recovered fact. Found while pinning the manaType
      order the IRO* rings compare against: that is MANA_* - 0 Earth, 1 Fire,
      2 Air, 3 Water - which is StandardConstants' GEM_* order less one, so the
      constants file is at least self-consistent.
    related: [board.gem_ids, mana.pool_and_ceiling_offsets]
    status: open

# --------------------------------------------------------- port decisions ----

# Choices we made, not facts about the game. Kept apart so that changing our
# mind about one does not look like new evidence about the original.

port_decisions:

  - id: port.hooks_take_context
    decision: Status effect hooks take a Combat.status_context, not a character index
    rationale: >
      The Lua passes characterIdx into the battle's character array. There is no
      such array here - a battle is a combatant list - and three of the seventeen
      need GET_ENEMY anyway. Only the seven hooks the scripts use take a context;
      the other thirty keep their indices because nothing calls them.
    supersedes: null
    date: 2026-10-04

  - id: port.match_hooks_return_unit
    decision: OnMatch4 / OnMatch5 are typed unit, not int
    rationale: >
      Item.hooks types its own on_match4 as returning an int, so the two records
      disagree. Vigiled is the only implementer and its Lua returns nothing.
      Whether the engine reads nil back as a zero contribution is not recovered.
    supersedes: null
    date: 2026-10-04

  - id: port.sfca_loop_cap
    decision: SFCA's unbounded repeat loop is capped at 1000 attempts
    rationale: >
      The only deliberate divergence from the original. Unreachable in practice -
      boards are refilled before spell effects, and four 3x3 explosions remove at
      most 36 of 64 cells - but it cannot terminate as written.
    supersedes: null
    date: 2026-10-04

  - id: port.headless_first
    decision: The port was built headless and animation-free
    rationale: >
      A deliberate fast path, not the destination. The target is a playable
      product, so the presentation layer has to be reversed eventually. This
      decision is superseded in intent, not reversed in fact - the mechanic layer
      is what made the presentation layer tractable.
    supersedes: null
    date: 2026-10-04
    status: superseded_in_intent

  - id: port.presentation_dropped
    decision: Presentation calls are dropped rather than implemented
    rationale: >
      Valid while headless. Needs revisiting for a playable build, at which point
      the audit in audit.animeffect_family is the first step rather than an
      alternative to it.
    supersedes: port.headless_first
    date: 2026-10-04
    status: open

  - id: port.bitmap_fonts_not_ttf
    decision: Text is drawn with the game's own bitmap fonts, not with SDL_ttf and a font pipeline
    rationale: >
      tools/graphics_plan.md phase 3 specified `tsdl-ttf` on the reasoning that the
      game's strings are translated into five languages and therefore need font
      rendering rather than a fixed glyph set. That reasoning was sound and the
      conclusion was wrong, because it never checked what the game ships: ten font
      atlases in Assets.zip, each with a per-glyph table, plus 32 named styles per
      language carrying the colours.

      Using them is strictly better than a TTF here - no dependency, no glyph
      synthesis, no font pipeline, and the original's own typeface and metrics - so
      `tsdl-ttf` was installed, found to be unnecessary, and is not linked by
      anything in the tree. The translated-text concern it was chosen for is
      answered by the glyph tables' code range of 32..8482, which already covers
      more scripts than the five languages need.

      What is given up: text can only be set in a face the game ships, at its own
      size. Arbitrary sizes and any character outside those ten faces would need a
      TTF after all. Nothing on the battle screen needs either.
    supersedes: null
    date: 2026-10-05

  - id: port.advance_is_ink_width
    decision: A glyph advances by its ink width, or by its bearings if it has no ink
    rationale: >
      An inference, not a recovery - see font.glyph_advance_is_stored and the open
      question font.advance_field_mapping. Two measurements support it over the
      alternative: the table's two bearings sum to the ink width rather than adding
      to it, and the atlas packs cells edge to edge so there is no baked-in offset.
      The bearings-only case covers the space, whose 1px rectangle is a placeholder
      and which would otherwise render "you 60" as "you60".

      Recorded as a decision because it is the one number every glyph position in
      the project depends on, and because the honest summary of its status is
      "inferred from the assets and confirmed by how the result looks", not
      "recovered".
    supersedes: null
    date: 2026-10-05

  - id: port.spell_sound_is_guessed
    decision: A cast plays a spell sound chosen by whether it costs mana
    rationale: >
      The registry names six spell sounds - nature, buff, debuff, fire, heal,
      alter - and which one a spell uses depends on what the spell actually does.
      That mapping is not recovered, so rather than leave casts silent or invent a
      plausible-looking table, `Sound_map.spell_sound` picks `snd_spellfire` for a
      spell that spends mana and `snd_aispell` for one that does not.

      Every tag it can return is a real one, so nothing can come out as a
      wrong-file-but-plausible noise; the risk is a mismatched category, which is
      the lesser one. It is one function, and a caller with the real mapping should
      replace it.
    supersedes: null
    date: 2026-10-05

  - id: port.spell_fx_follows_the_script
    decision: A spell's effect and sound come from its own script's SPELLFX constant, looked up by spell id
    rationale: >
      The game does not decide what a spell looks like from the spell's data; it
      decides it from the script, which passes a `SPELLFX_*` constant to one of four
      `Std_*SpellEffect` helpers. The recovered chain is: spell id, script, constant,
      effect asset, sound tag.

      The port has no scripts - `lib/spell_effects.ml` inlines 21 spell bodies
      because a headless battle runs none - so the constant is looked up by the
      spell's id, which is the script the game would have run. `lib/spell_fx.ml` is
      generated by `tools/extract_spell_fx.py` from all 130 of those scripts and the
      two tables the helpers resolve constants through, so no row of either table is
      transcribed by hand and `--check` fails if the archive and the module disagree.

      What this does not recover is *where* a grid effect lands: `SBAC` passes a cell
      it has just chosen, and the cell comes from the spell body rather than from the
      constant. So the caster effects are addressed here and the grid effects are not
      yet, which is recorded rather than left to look like an oversight.

      One recovered oddity is kept rather than tidied: `SPELLFX_HURLGOBLIN` names the
      fireball's effect and its sound. That is the file's own copy-paste, and a test
      says so - which is what stops a later tidy-up from "fixing" the port away from
      the game.

      This replaces `port.spell_sound_is_guessed`, which chose a spell's sound by
      whether it cost mana. Nothing asserted that guess, because a guess naming a real
      sound file is indistinguishable from an answer at runtime; `test_spell_fx` pins
      the recovered tags instead, on the real spells.
    supersedes: null
    date: 2026-10-06

  - id: port.sound_channels_are_per_tag
    decision: Each sound tag tracks its own mixer channel, rather than one global active sound
    rationale: >
      `Engine_PLAY_SOUND_4b38a0` compares the entry against one "currently active"
      entry held under a global manager, so two different sounds never overlap from
      this path - a cascade sound and a damage sound would cut each other off.

      The port gives each tag its own channel, so they can sound together. That is a
      deliberate divergence: it is closer to what the game sounds like, where a
      cascade rumbles under the damage numbers rather than replacing them. The
      recovered part - not restarting a sound that is already sounding - is kept per
      tag, which is what stops a burst of mana events turning into a click.
    supersedes: null
    date: 2026-10-05

  - id: port.present_from_the_event_log
    decision: The presentation layer is driven by Battle.on_event, not by re-reading the log after the fact
    rationale: >
      The engine resolves a whole turn internally, so a front end that waits for
      `take_turn` to return sees every event in that turn at once and replays a
      burst; one that polls the log misses the order. An optional observer on
      `Battle.emit` gives the same events in sequence, and `emit` was already the
      single place an event is recorded, so this is a second call at an existing
      point rather than a new interposition in the recovered logic.

      `MatchResolved` turned out to be emitted **once per cascade step**, carrying
      which runs matched, so cascades already arrive individually and the cascade
      granularity needed no engine change at all. That was not known when this was
      decided; it is why the change is one optional field rather than an
      instrumentation layer threaded through `resolve_matches`.

      Defaults to `None`, so every faithful test and the headless runner are
      unaffected - `test_battle` asserts that an unwatched battle still logs
      exactly as before.

      Animating gems - swap slide, cascade fall, match pop - needs board snapshots
      at each cascade step, which this does not provide. That is
      `port.animate_from_board_snapshots`, decided since.
    supersedes: null
    date: 2026-10-05

  - id: port.float_text_mapping_is_ours
    decision: Which battle events become floating text, and where they sit, is our choice; the placement rule is a port
    rationale: >
      The engine's float text is driven by spell scripts calling
      `ADD_TEXT_MESSAGE`, and a headless battle runs no scripts - the effects are
      inlined in `spell_effects.ml`. So nothing in the original decides that a
      `Damage` event shows a red number; that mapping is ours, and is recorded as
      such rather than presented as recovered.

      What {e is} recovered is everything around it: the positioning is a
      transcription of `Engine_ADD_TEXT_MESSAGE_415120` (see
      `pres.float_text_anchors_on_min_corner`), the colours come from the seven
      `font_msg_*` styles in `<Language>/Font.xml`, and the stack is bounded because
      the original's message stack is a fixed ring of 60-unit slots.

      The mapping is asserted event by event in `test_gfx_float_text`, including
      the events that deliberately produce nothing - a turn boundary, a swap, gold,
      XP - because that boundary is where a headless battle quietly decides what a
      player sees.
    supersedes: null
    date: 2026-10-05

  - id: port.animate_from_board_snapshots
    decision: Gems are animated from Battle.step board snapshots delivered by a second observer, and each step is played out before the engine continues
    rationale: >
      `Battle.on_event` cannot carry this: an event is a fact, and a cascade fall
      needs the board on either side of the change. `Battle.step` therefore carries
      the boards - the swap's before and after, and for each cascade step the board
      as the player saw it, the same board with the matches gone and the gaps still
      open, and the board after gravity and refill - and `Battle.on_step` hands them
      over where they are produced rather than at a new interposition in the
      resolution loop. Keeps the log a log: putting a board inside every event would
      have made reading the log a rendering concern.

      The second half of the decision is the one that was not obvious. `Battle`
      resolves a whole turn synchronously, so every step of a six-step cascade
      arrives back to back while nothing is drawing. Merely queueing them means the
      board is already final by the time the queue drains, and what the player then
      watches is the board rewinding through states it already passed through. So
      the front end blocks in `on_step` until the animation it just queued has
      finished. That costs nothing: the engine is single-threaded and has no clock,
      so the only thing that can happen meanwhile is that no further steps are
      produced, which is the point.

      Each step's events have already been emitted by the time its callback runs -
      the engine emits the match, the gold and the mana, then mutates and refills -
      so the message and the sound for a step are up before its gems move. That
      ordering is the reason the block is in `on_step` and not in the event
      callback, and `test_battle` pins it: every cascade step must follow the
      `MatchResolved` carrying its number.

      The durations - a 0.14s pop, a 0.18s fall, a 0.13s slide - are ours, chosen to
      read as motion rather than recovered; nothing in the port knows the original's
      timing table. `--pace` plays a demo through the blocking loop so the paced
      path can be exercised without a keyboard, and `--shot-at` stops inside the
      first phase for a screenshot of a fall.

  - id: port.rotation_is_a_cpu_corner_turn
    decision: Quads are rotated on the CPU, and each run carries its own blend mode
    rationale: >
      Two capabilities the spell effects need and the batcher did not have.

      Rotation is done by turning the quad's four corners about its own centre in
      pixel space, rather than by passing an angle to the vertex shader. A quad is a
      rectangle, so the corner turn is exact, and it costs no vertex attribute and no
      shader change - which matters here because the shader is the one piece of this
      layer that the Android plan still has to fork.

      It has to be in pixel space. The clip-space conversion flips y, so rotating
      after converting turns a sparkle the *other* way, and the symptom is a slightly
      wrong angle rather than a coordinate error - the kind of thing that survives a
      screenshot. SpellHealing turns its ring through 12.4 radians, so the
      difference is not subtle.

      Blend mode is a field of Gl.run for the same reason the scissor is: the
      batcher does not draw when you push. All but a handful of particles ask for
      additive, and an additive sparkle drawn with the ordinary alpha blend is a
      grey dot rather than a glow.

      Both are pure enough to assert without a window - Gl.rotated_corners returns
      corners and nothing else - so 	est_gfx_fx pins the unrotated case, a quarter
      turn, that the centre does not move at 12.4 radians, and that a full turn comes
      back to where it started.
    supersedes: null
    date: 2026-10-06

  - id: port.effect_context_is_written_back
    decision: A cast writes the effect context's boxed board, gold and xp back into the battle before the sweep
    rationale: >
      An effect context holds [`fx_board`], [`fx_gold`] and [`fx_xp`] as refs. They are
      copies, not aliases: [`Board`] is a persistent value, so [`ref b.board`] is a fresh
      cell holding the board as it was, and a body's [`SET_GEM`] lands there and
      nowhere else. The combatants are the opposite - mutable records shared by
      reference - so mana, life and status effects survive a call with no write-back.

      That asymmetry is what hid the bug. The cast path applied gravity and a refill
      to [`b.board`] after running the body, without ever reading the body's board back,
      so every spell's board edit was discarded while its damage, its cost and its
      status effects all worked. The visible half of a cast was fine. Nothing in the
      suite noticed, because the spell bodies are tested against their own board ref
      and the battle tests assert the log and the totals rather than the grid.

      Found by the grid-effect work: the test that asks whether the cell a spell
      reported is the cell the board now holds failed, and the board it looked at was
      the one from before the spell.

      So the contract is written down where it can be read, and asserted: a body's
      board, gold and xp are copied back before the sweep, and the combatant half is
      asserted too so the asymmetry is on the record rather than re-discovered.

      What it does not settle is whether a line completed by a spell should then
      resolve - see `spell.match_resolution_after_a_spell`.
    supersedes: null
    date: 2026-10-06

  - id: port.grid_effects_are_an_observer_not_an_event
    decision: A spell's effect on a grid cell is reported through a third observer, not through the log
    rationale: >
      [`Std_GridSpellEffect(x, y, typ, `useSound`)`] is a fact about the presentation,
      not about the fight: it was audited as computing the cell's pixel coordinates
      and making one effect call, touching no life, mana, gem or status. But it is
      the one piece of the presentation that the port cannot recover from the asset
      tables, because the *cell* is whatever the spell body had just chosen -
      a random isolated cell for `SBAC`, the aimed cell for `SFOD`, three literals for
      `SCON`.

      So the battle carries it. The body calls the primitive, the primitive calls the
      callback, and the front end is told the cell rather than working it out - which
      is the only version of this that cannot drift, because a front end that
      reconstructed the cell would have to reimplement the spell's control flow.

      Not an event. A log entry is something that happened, and every faithful test
      that reads the log would then have to know about a sparkle; [on_step] set the
      precedent for the same reason. It defaults to [None], and a body that asks for
      an effect with no observer does nothing, so a headless battle is untouched -
      asserted by running the same battle watched and unwatched and comparing the
      logs.

      The demo cannot show this working, and says so: four of the eleven spells that
      put an effect on a cell ask for a zero AI casting chance, and the rest are
      gated behind the AI only casting when the board is worth 30 or less. The
      counter in the demo line reports zero, and the test drives one through the human
      hook where the choice is scripted.
    supersedes: null
    date: 2026-10-06

  - id: port.animation_geometry_is_ours
    decision: The scissor rides on the draw run rather than around the pushes, and only the matched gems fade
    rationale: >
      Two small things about `Gl`, both of which look like rendering bugs rather
      than like state management.

      The vertex batcher does not draw when you push: `push_quad` accumulates and
      `submit` issues every draw at the end of the frame. A scissor enabled around
      the pushes and disabled straight after is therefore still enabled when
      `submit` runs, and clips the whole frame; the same pair around `submit` clips
      nothing. So the rectangle is a field of `Gl.run` and `submit` applies it per
      batch. It is what confines a gem dropping in from above row 0 to the board
      instead of painting over the title art - and the scissor box is bottom-up
      while everything else in the file is top-down, so the y is flipped.

      The pop's fade is carried per gem rather than per frame. One alpha for the
      frame would dim the stationary board along with the matched three, which
      reads as the entire board flashing; only the matched gems shrink and fade, and
      the fall is opaque throughout, because a gem that arrives while fading up
      looks like it materialised instead of landing. Both are asserted in
      `test_gfx_anim`.
    supersedes: null
    date: 2026-10-06

  - id: port.capture_grid_rules
    decision: >
      The capture grid is laid out as shipped, an all-empty grid reads as won at
      once, * parses as a Wildcard 2, and an in-progress attempt is not saved
    rationale: >
      Four small choices where the game's own data leaves a gap, each recorded
      rather than passed off as recovered.

      No refill is not among them - [CAPTURE_HELP] asks the player to clear the
      grid, which refill makes impossible - so the settle loop is the battle's
      resolve+gravity and stops when no match remains.

      The grid is laid as shipped, pre-existing runs and all: 17 of the 60
      grids carry a match at rest, and whether the engine laid them pre-cleared
      is not recovered, so the first swap's resolution clears them rather than
      a start-of-attempt sweep inventing one. An entirely empty grid (8 of the
      60, on non-combat monsters) reads as already cleared - the goal met -
      so capture_begin returns a won attempt rather than an unplayable one.
      The charset's * carries no multiplier in the data, so it parses as
      Wildcard 2, the low canonical value; the battle's own 5-match wildcard
      spawn (min 8 count) is a different rule and is untouched. And an attempt
      in progress is not written to the save: the grid is static data, so a
      load rebuilds it with capture_begin while the state that matters -
      defeat counts, captives, the dungeon flag - round-trips.
    supersedes: null
    date: 2026-10-08

  - id: port.quest_battle_loop
    decision: >
      Quest battles run through the shared battle constructor with the hero's
      line-up as the fight's <Spell> list plus the player's known spells,
      the monster scaled to the player's level as on the road, and the
      outcome applied by a settle step that can be driven directly
    rationale: >
      One engine loop instead of demo-scripted steps was the goal: a quest
      fight gets the same board, rosters, companion hooks and AI as a road
      fight. The loadout choice - the fight's spells on top of what the
      player knows - is what a character who has learned spells brings;
      hero-only would have the player forget everything between fights and
      XML-only would ignore the profession table. Riding the road scaling
      formula is consistency, not recovery: no shipped data pins a separate
      curve for quest monsters, and a second invented one would be worse
      than one shared one. Settle is split out of run because the auto-AI
      loses most fights before the AI overhaul lands, and the win
      bookkeeping - advance, capture, ruin release, spoils - has to be
      exercised whether the dice deliver a win or not.
    supersedes: null
    date: 2026-10-08

  - id: port.companion_hooks_fire_for_the_party
    decision: >
      Every companion id in the party fires OnStartBattle once, after
      Battle.create and before the first turn, hero side only;
      ACTIVATE_COMPANION is recorded as the activated list, and the party is
      capped at eight
    rationale: >
      The ten scripts and the 37-name hook table put OnStartBattle in the
      engine's dispatch, but the caller that walks the party is behind no
      capture - the decompiled dumps only hold binding tables - so who fires
      whom is a choice rather than a recovery. Firing the whole party once at
      battle open is what the scripts themselves describe: their guard is the
      enemy, never the timing, and [COMPANIONS_HELP] says the companions
      "assist you in battle" with no further ceremony. ACTIVATE_COMPANION has
      no recovered body - the Lua binding is an address with no capture behind
      it - so it is kept as bookkeeping: the activated list the caller reads
      back, with each hit riding the existing Damage event where float text
      already comes from. Only the hero's party is modelled; the
      characterIdx == 1 branch would be a companion on the enemy side, which
      the campaign never produces. The eight-slot cap comes from the same help
      string, and a ninth is turned away at RewardCompanion rather than
      growing the party - [COMPANIONSTATUS_NEW0] describes exactly that
      refusal, though the removal flow behind it is UI this port does not
      have. The companion's home location and the leaving-a-companion-behind
      flow are not modelled; [COMPANIONSTATUS_OUT0] has a %s for the location.
    supersedes: null
    date: 2026-10-08

  - id: port.item_start_battle_dispatch
    decision: >
      Item start hooks fire after the companion pass, for both sides'
      loadouts; the equipment panel folds into the four battle slots by
      each item's own location in field order; activations emit no event
      and the mana credit is uncapped; placement does not re-run can_equip
    rationale: >
      The scripts pin the timing only as "whenever a new battle is started,
      before the first player takes a turn", and nothing recovered says who
      walks which object kind first, so companions-then-items is a choice -
      every shipped body is independent of the others'. Both sides get the
      pass because a city wall's owner is the defender, a fight the
      campaign does not reach yet, and firing one side only would bake that
      in. The fold-by-location keeps placement self-describing from the
      item data rather than from the panel's nine field names, whose split
      against the four battle slots (ITMLOC0..3) is not recovered; two
      items of one location leave the later field wearing the slot, which
      is the record's own order doing the deciding. NOTIFY_OF_ACTIVATED_ITEM
      is already unmodelled across the companion claim, and uncapped mana
      follows ManaBonus. can_equip stays with the equip flow this port does
      not have: with no way to put on gear, re-checking at open would be
      checking nothing.
    supersedes: null
    date: 2026-10-08

  - id: port.human_aim_click
    decision: >
      A cast whose input_type is not 0 asks for its target inside the spell
      question: one click on a cell is the aim and the cast, a click on the
      spell bar cancels back to the spell question, and a click that is
      neither board nor bar asks again. Every cell the board owns is a valid
      target - the column and row spells read the coordinate they need and
      the grid spells read both - and the console front end asks for the
      same cell in b3 form. Machines aim at nothing until the six Lua hooks'
      picks are ported.
    rationale: >
      The original's own selection input is not recoverable from the assets,
      and the port's prompts are click-based already: the swap prompt
      restarts its selection rather than refusing, and the spell prompt's bar
      is the standing way out of any question it asks - the trap the first
      input.ml regression was about. One click to aim follows both rules; a
      separate confirm step would add a state the original's drag does not
      have, and cancelling must return to the spell question rather than
      decline the turn, because the spell was already picked. Guessing a
      machine's cell would be inventing aim the Lua does not let us observe:
      the hooks say "Store a grid in case we cast!" but their picks are not
      ported, so None keeps the aimed effects on their recovered no-op path
      until the picks are.
    supersedes: null
    date: 2026-10-08

  - id: port.ai_aim_fallback
    decision: >
      The three aimed spells whose hooks store nothing (SFOD, SSPA, SPRO) aim
      at nothing when the machine casts them - the None the effects already
      no-op on - rather than at cell (0,0) or a fresh random cell. SCHG's one
      stored slot is carried as y with x zero, the coordinate the row sweep
      reads; the column spells' slot0 is x. The count guards stay in charge
      of castability and the search only chooses the cell.
    rationale: >
      Nothing in the assets says what an unset input slot held: a
      zero-initialized read is a guess, and a fresh random cell would be aim
      the Lua does not show us taking. None keeps those casts on the no-op
      path they were already on, which is the honest state rather than an
      invented one. The slot mapping follows the readers that are ported and
      tested - row sweeps read y, column sweeps read x - so a machine and a
      player present the cell the same way. And the gates were already the
      count guards before this commit; keeping them means the only behaviour
      added is the cell, which is the half that was missing.
    supersedes: null
    date: 2026-10-08

  - id: port.campaign_task_level
    decision: >
      The task level a campaign fight computes difficulty from is the
      encounter's my_level on the road and the monster's registry level_base
      in a quest fight; rules.hero_level_cap stays at default_rules' value of
      20. Everything else in default_rules carries over unchanged, and a test
      that means to pin a rule field passes its own rules to open_battle.
    rationale: >
      Std_GetDifficulty takes (heroLevel, taskLevel) and the assets never say
      which number either is at fight time. my_level is the one level the
      encounter record carries - the same field the spawn gate already
      compares the hero against - so it is the encounter's level by the only
      reading the data supports. A quest fight has no encounter record; the
      monster's level_base is the level the registry gives it, and scaling it
      to the hero would make the band a constant, which would defeat the
      bridge the band exists to be. hero_level_cap only reaches the
      evaluator's hero-level jitter at bands 0 and 1, and with nothing
      recovered about the engine's value the default is the honest one rather
      than a guessed ceiling.
    notes: >
      Superseded 2026-10-13 by port.difficulty_source: the band turned out to
      be dead in the shipped game, so a campaign fight's difficulty no longer
      comes from a task level at all. my_level still gates the spawn and
      level_base still describes the monster; neither reaches the rules.
    supersedes: null
    date: 2026-10-08

  - id: port.difficulty_source
    decision: >
      Campaign fights take Battle.rules.difficulty from Campaign.difficulty,
      a module-level ref defaulting to 1 (Normal) that set_difficulty clamps
      to the dropdown's 0..2; rules_for_battle no longer takes a task level,
      and Spell.difficulty_for_levels keeps its boundary test and no caller,
      exactly as the asset ships it. rules.hero_level stays the player's own
      level and hero_level_cap stays at default_rules' 20.
    rationale: >
      The original reads Difficulty out of the registry at battle start
      (ai.difficulty_is_the_player_option) and the hero/task band has no
      callers anywhere, so wiring the fight's difficulty to levels was a
      deviation the evidence stopped supporting. Defaulting to 1 rather than
      0 takes the settings object's own default (0x43729E) over the
      zero-initialised global, which is what a machine that had saved its
      options once would run. The port has no options screen, so the choice
      lives in a ref a driver can set rather than in the per-hero save - the
      original keeps it machine-wide in the registry, not in the .pqhero.
    supersedes: port.campaign_task_level
    date: 2026-10-13

  - id: port.battle_screen_layout
    decision: >
      The battle front draws the original's rectangles where GameMenu.xml
      gives them - both character pads, both columns of seven spell rows, the
      life bars, the turn plates and the turn line - and keeps three choices
      of its own: the board stays centred in the window minus a 96px bottom
      band, at the gem sheet's own 71px cells rather than being pinned to
      pad_grid at (217,130) with the asset's 73; the four mana bars per panel
      and the combat log under the board are the port's rectangles, since the
      original paints mana into portrait art and has no log at all; and only
      the hero's column of rows is clickable, through
      Input.of_rects (Battle_layout.spell_rows Hero), while the enemy's seven
      are labels for the roster it fights with.
    rationale: >
      Fidelity where the asset speaks and a choice where it does not: the pads
      are the shipped screen, so inventing a spell bar somewhere else would
      disagreeing with the game for no benefit, while pinning the board would
      cost the resize-robustness Layout.create exists for and buy back two
      pixels a cell that the gem sheet does not carry. The log is a deliberate
      addition - the engine narrates every event and a windowed battle had
      nowhere to show it - and it takes the band the spell bar used to occupy,
      which is why the buttons moved rather than the log finding a corner. The
      plates are drawn without the countdown they carry in the original
      because the port runs no turn clock, and a click on a row a spell cannot
      pay for declines exactly as the bar's own dead buttons always have.
    supersedes: null
    date: 2026-10-13

  - id: port.travel_model
    decision: >
      Travel time is node_distance measured in map units at one unit per
      tick, with no mount or speed modifier. The encounter roll happens
      once, at departure from a road, against that road's list, and the
      first encounter that appears in data order is the one that stops the
      hero.
    rationale: >
      Nothing recovered carries a speed: node_distance exists and the file
      itself calls it a distance heuristic for travel time, so measuring
      time in the same units keeps the only number the data gives, and
      mount speed stays a documented gap rather than a guessed constant
      here. The Lua comments fix when appearance is asked - a move to a new
      location - but not how often a road is polled while it is being
      crossed; one ask at departure matches the comment without inventing a
      polling rate, and a caller that wants a mid-road popup can re-ask
      every tick of its own choosing. Two encounters active on one road at
      once has no recovered tie-break, so data order decides.
    supersedes: null
    date: 2026-10-08

  - id: port.map_screen_mapping
    decision: >
      The 2048 map fits the window at the smaller axis scale and centred -
      (128, 0) and 3/8 in the game's own 1024x768. A click hits a node
      within 16 screen pixels of its drawn centre, and the front end walks
      at 120 world units a second. Drawing shows only nodes whose visible
      flag is set, and a road only while both endpoints are.
    rationale: >
      No asset records the original's viewport or any pan over the map, so
      the reading chosen is the one that shows the whole square with
      nothing off-screen and no invented panning state. The radius is in
      screen space because that is where the click is: at 3/8 scale it is
      43 world pixels, generous next to the nodes' spacing, and comparing
      at the node's drawn position keeps rounding from making a node
      unhittable where the window draws it. The walk rate leaves the
      recovered model intact - time in map units, one unit a tick, the tick
      the front end's to give - and 120 a second makes the seed city's own
      road about a second long. Visibility reuses the flags the quest and
      save machinery already maintain rather than a second fog.
    supersedes: null
    date: 2026-10-08

  - id: port.city_services
    decision: >
      Buying checks only gold against the item's cost - no skill gate, no
      equip-on-buy, no sell side. The panel reuses ShopMenu's recovered
      coordinates (title, gold line, seven rows at y=170+26, mode and
      Done) with a 480-pixel row span; the mode button cycles Shop, Spells
      and Tavern; the tavern cycles all fifty-five rumors in tag order;
      and the window opens the panel when you click the city you stand in
      or arrive at one.
    rationale: >
      The only price the assets carry is the item's cost, and
      SHOPMENU_TEXT's greying is affordability - gating the purchase on      the skill the same text reserves for red items would take a
      requirement list nothing recovered has, and equip already has its      own flow. ShopMenu's button geometry is drawn in the original and is      recoverable; how far right the clickable row ran is not, so 480 is      the span that holds a name and a price. The rumors have no per-city      mapping and the player keeps no book, so table order is the reading      that needs no invention. Opening on click-where-you-stand matches the      map window's own rule: one click means the thing you are already at.
    supersedes: null
    date: 2026-10-08

  - id: port.location_action_flow
    decision: >
      The driver calls query_actions, execute_action, complete_action and
      enter_location around dialogue and battles. Query is first-match in
      source order; the other events apply every matching group in source
      order against the live accumulator, each group's full arm
      conjunction holding - the companion gate the extractor parsed from
      the open if-headers ((companion id, must-be-present) pairs, an
      else-arm flipping the single test), the script-var and inventory
      tests the header carried (var_test / item_test slots checked at
      apply time against player.quest_vars by var_test_ok and the
      traveling inventory by item_test_ok), and the nand clauses that pin
      out the sibling arms of the row's own if/elseif chain: a clause
      re-checks a predecessor arm's key (its stages, locations, success
      side, companion, vars and items - empty list = that dimension was
      untested), and a row applies only when no clause fires. Clauses
      evaluate against the chain's ENTRY snapshot - the fold-start player,
      advanced past a fired row - never the live accumulator, because an
      arm's own SetQuestState or remove_companion must not unblock a
      sibling of its chain: Q1G3's and Q0Q0's OnCompleteAction post one
      box, write questState = 2 and stop; the elseif questState==2 turn-in
      arm waits for the next call, exactly the single-entry if the Lua
      writes. Group keys keep the (questState, idLocation) pairs with
      -1/"" wildcards, complete groups the success/failure bit, and every
      key carries the same conjunction; QS00 queues NOCOMP or PRELUDE,
      QK06 NOCOMP or BUTTON, QP01's first-match query skips a label whose
      companion is away, Q1S0's three triedToKeepKey arms (conversation /
      Khalkusno box / heirloom complete) split by NKHA x the local,
      QA03's stage action fights only with NDKH along and doneConv set,
      Q3Q5's necropolis sites gate per-site done-flags, the tried-flags
      and the ISES rod in the inventory, Q0Q0's lostToThief twins queue
      one conversation. The three flat lists carry the same conjunction:
      OnBegin conversations (Q0Q8, Q3Q6 - both gated NKHA) queue only
      when their pair holds, callback_effects rows fold under the gate at
      execute_callback time with their clauses, and the 15 battle_actions
      stage actions decide fight-versus-box by companion and clause
      (QA00/QA03 NDKH, QK00/QU00 families NKHA/NSUN). Group rows also
      carry a terminates flag: a bare `return;` at the site's own nesting
      level ends the hook body, so the fold stops once the row applies -
      Q2Q7's OnCompleteAction is the only hit in the corpus. enter_location
      folds the groups before the remove rules apply: Lua tests companions
      at if-entry while the removes sit inside the chosen arm (Q3S0
      messages then removes, QS00 removes then messages), so the gates
      must read the party the arrival started with. ShowMessage effects
      queue through pending_messages; pq_conv_gfx pops them as a modal
      box whose OK click fires the box's callback.
    rationale: >
      The Lua bodies are sequential ifs, and every hook is single-entry:
      once an arm runs, the elseif chain that arm belongs to is finished -
      OnExecuteAction and OnCompleteAction included, which is why Q1G3 and
      Q0Q0 turn in on the NEXT call at the advanced stage, not inside the
      event that wrote the stage. The runtime used to read the live stage
      in every guard, so those quest's own write-to-2 unblocked their
      turn-in arm in the same call; three tests pinned that fall-through
      reading and are rewritten as exclusivity pins against the Lua. The
      clause's entry snapshot threads the needle the other way: a later
      CHAIN in the same hook still re-tests the state a prior chain wrote
      (the snapshot advances past a fired row), while a sibling arm of the
      firing chain stays pinned out. The third message argument is the
      display anchor (idLocation/myLocation), not a guard - forcing it as
      one broke Q1E0's SUCCESS2/FAILURE2 boxes. A message row only comes
      from an assignment in the same branch arm as its site: an assignment
      in a sibling arm of a branch open at the site is dead there, so two
      sites inside one if/else no longer pick up each other's text (the
      rule that removed the duplicate SUCCESS1/NOCOMP boxes Q3Q6, QK06,
      QS02 and the phantom FAILURE copies Q1Q0/Q3Q2 carried). Companion
      gates and then var/item slots split the arms that shared one key
      (54 groups + 4 query rows companion-gated; 52 groups + 41 query
      rows var-gated, 8 item-gated, 380 clause-gated groups, 8 var-gated
      callback sites; extractor --check reconciles every count). The
      group-before-removes order is forced by Q3S0: removing the gated
      companion first would flip the very test the arrival message keys
      on. A caller-driven complete_action keeps the battle settle
      decoupled, matching the quest_battle_complete separation, and
      campaign_demo walks Q0I2's whole chain as the reference driver.
    supersedes: null
    date: 2026-10-12

  - id: port.full_loop_map_actions
    decision: >
      The location-event loop is playable in the map window: the city
      panel's Actions tab lists Campaign.query_actions for the node and a
      click starts it through execute_action; travel arrivals fire through
      advance_travel_with_events (advance_travel plus enter_location on
      AtNode), so guarded boxes and trees queue on landing; the shared
      gfx/conv_window module hosts queued dialogue, message boxes and
      callback battle banners over the map (pq_conv_gfx is now a thin
      front over it), and when the dialog drains the driver follows with
      complete_action. Conversation trees open in the hosted window
      instead of printing.
    rationale: >
      Queues are engine state, and a front end that only prints them
      leaves the loop untestable in the real UI; hosting them in one
      shared module keeps pq_conv_gfx and pq_map_gfx on the same window
      code and makes the pending-conversation walk the interactive path
      the engine always implied. complete_action stays caller-driven
      (decoupled from battle settle, matching quest_battle_complete), and
      the road popup still outranks the dialog in the click order,
      matching the road fight's interruptive role. The map city panel
      covers cities only (waypoints are not browsed), and quest-stage
      battles (run_quest_battle) are not yet wired to action rows.
    supersedes: null
    date: 2026-10-10

  - id: campaign.companion_roster_equip
    decision: >
      Equipping a companion is party membership: recruited_companions is the
      roster of everyone ever granted, the party is the equipped subset of
      at most eight, add_companion joins only at the companion's home, and
      remove_companion is free anywhere and keeps the roster.
      companion_slot reads the five states a driver needs (Traveling,
      At_home, At_home_full, Away, Not_recruited), and the save carries the
      roster separately, defaulting to the party for saves written before it
      existed. The OnStartBattle hooks - the companion's whole recovered
      mechanic - fire for the party, so the equip act gates the passive.
    rationale: >
      COMPANIONSTATUS_IN/OUT0/OUT1/OUT2 are one status screen over two
      lists: traveling, or located at a home the registry already carries,
      with OUT1's "you may add them at this location" as the pickup gate and
      NEW0 refusing only the party. Companions ship no skill data of their
      own - the ten hooks are the passives - so no separate stat fold
      exists to invent, and the hook following the party needs no change.
      Both equip calls no-op on a refusal so a driver that read
      companion_slot cannot double-apply. The map Companions tab sorts the
      registry by status so the visible rows carry the party and the
      at-home companions first; paging past seven is cosmetic-open.
    supersedes: null
    date: 2026-10-10

  - id: port.aim_hover_highlight
    decision: >
      While an aim question is open, the play front tracks the mouse and
      lights the shape the spell reads - the whole column for input_type 1,
      the whole row for 2, the one cell for 3 - under the cursor, with the
      same selection glow a pending swap uses; a faint ring marks the cell
      under the mouse at all times, and the HUD prompt says aim. Every cell
      stays a valid target, so the shape is the highlight and there is no
      filter to apply.
    rationale: >
      Nothing recovered says which cells the original rejects as targets, so
      port.human_aim_click already accepts all 64; "valid-target
      highlighting" can therefore only mean the shape, keyed off the
      input_type the front end already has when it opens the question. Hover
      is presentation only and lives entirely in the front end: the battle
      is parked inside choose_spell, so the front end is the only code
      running, and a mouse_motion repaint (the repo's first) is what keeps
      the highlight live while the battle clocks idle. The column/row shapes
      come from Layout.aim_cells so the geometry is testable without a
      window.
    supersedes: null
    date: 2026-10-10

  - id: port.mount_travel_speed
    decision: >
      The ridden mount is player.mount - a chosen captive whose monster
      record ships mount="1" - and travel_time divides the node distance by
      its speed tier: mount_speed 0/1/2 as a 1.5 / 2.0 / 2.5 multiplier, 1.0
      on foot. begin_travel takes the player, so the crossing is timed at
      departure; the front end keeps feeding walk_speed a second against the
      shorter total_time.
    rationale: >
      Mounts are captured, not bought or rewarded (INV_MOUNTS_TEXT,
      YOURCITY_PETS_TEXT), and MOUNTS_HELP says you choose a single one - so
      the chosen state sits beside captives, while the equipment record's
      mount field stays the panel's item slot it always was (no item is a
      mount; a monster id stored there would break item_by_id on load). The
      tier numbers are the capture strings' own words - slow, average, fast
      for mount_speed 0, 1, 2 - and the rumor "a mount moves you faster"
      makes even the slow tier beat walking, which fixes the three values as
      evenly spaced multipliers rather than a guess at the original's
      arithmetic. Fly grants nothing here; the skill and spell bonuses
      (MOUNTS_HELP's other two purposes) landed separately in
      port.mount_skill_formula. This extends port.travel_model, which
      measured the road at one unit per tick with no modifier when nothing
      was choosable.
    supersedes: null
    date: 2026-10-10

  - id: port.mount_skill_formula
    decision: >
      The ridden mount's combat bonuses read straight off the registry at
      battle setup: the skill delta is mount_addstat + ((level - 1) /
      mount_addlevel) * mount_addperlevel in the skill mount_stat names
      (Combat.skill_of_index, 0-based), added to the combatant's skills and
      never written to player.skills, and mount_spell is prepended to the
      hero's spell ids - road, quest and callback fights alike - for
      spells_of_ids to dedup against the learned list.
    rationale: >
      The capture strings are the formula's only statement ("+2 (+1 more
      per 2 levels)"): reading the step as (level - 1) / addlevel makes
      level 1 show exactly the printed +N, and both that and a plain level /
      addlevel fit every string, so the port picks the reading that pins
      level 1 to the verbatim text. mount_stat matches the engine's SKILL_
      numbering already ported as skill_of_index - all eight mounts name the
      same skill their string does, MSCO/MSWO Earth at index 0 - so no new
      mapping is invented. Nothing recovered stages a bonus outside a fight;
      player.skills is the profession base that level-up and the save carry,
      and a stored bonus would double on re-mount, so the delta rides the
      combatant the way the companion SkillBonus payoffs already do. The
      extra spell follows the quest path's own shape (fight spell ids in
      front of known_spells). Fly and training-based encounter avoidance
      stay open: YOURCITY_MOUNTS_TEXT ties avoidance to training levels,
      which the port has no system for.
    supersedes: null
    date: 2026-10-10

  - id: port.capture_ui
    decision: >
      The capture minigame is offered after a won road encounter only.
      pq_map_gfx runs Campaign.capture_offer when the road popup closes on
      a player win; on Some it opens Capture.t through capture_begin and
      the window takes over every click until a terminal state is
      dismissed through capture_finish or the player backs out via
      [CANCEL]. Callback battles, quest battles and the city Pets list
      keep their current flows.
    rationale: >
      The engine already records defeats on all three battle paths, so the
      offer helper is path-agnostic - wiring the road popup is simply the
      one surface the map front already owns end-to-end (popup -> result),
      and it matches [CAPTURE_LISTHELP]'s "beat it in a battle" framing.
      Callback and quest wins already settle their own capture flag and
      banners; opening a modal minigame from the conversation window or
      the quest panel would need focus rules those screens do not have
      yet, so they stay open (Capture surfaces in GAPS). [CANCEL] is a
      port addition - the shipped screen has no give-up button - because a
      stuck player would otherwise be forced to finish a grid the port's
      no-refill rules may make unwinnable; giving up keeps the recorded
      defeats, so the next eligible win simply offers again. The minigame
      freezes travel while it is up, like the road popup does, so a
      journey cannot run past the window.
    supersedes: null
    date: 2026-10-10

  - id: port.capture_surfaces
    decision: >
      Capture is offered on every battle surface the interactive game has.
      Callback fights (the conversation battles that carry the quest
      fights) settle cb_capture_offer inside execute_callback - won,
      cb_capture allowed, both gates holding after the defeat is recorded -
      conv_window parks it beside the Victory banner, and the map front
      takes it through take_capture_offer on the banner's dismiss and
      opens the minigame over the conversation. The city panel gains a Pets
      tab: capture_candidates rows (registry order, gates holding, not yet
      held) click straight into capture_begin, held captives display under
      them with the [PETS_DETAILS] count, and entering the tab prints
      [YOURCITY_PETS_TEXT]. run_quest_battle has no interactive screen, so
      quest wins arrive through these callbacks; road wins already open the
      minigame post-win (port.capture_ui), and the original's pre-battle
      MonsterInfoMenu [CAPTURE] button stays unwired.
    rationale: >
      The offer helper is id-based because that is what every surface can
      provide: encounters carry a sprite, callback rows carry
      cb_monster_id, and the list walks the registry - one gate function
      (capture_offer_id) under all three, with the won/capture-flag part
      split into callback_capture_offer so the NOCAPTURE rule is testable
      without winning a 140-life fight under the auto-AI. Opening on the
      banner's dismiss keeps the port's established rule that a win is
      followed by the attempt (the player backs out through [CANCEL])
      rather than adding a prompt the shipped banners do not have; the
      conversation keeps talking afterwards because the capture-first
      click routing and the frozen conv step hold it. The Pets tab rather
      than a new window: [PETS] is a panel of the city's own furniture
      family, the city panel already cycles tabs, and no shipped screen
      XML carries an eligible-enemy list to reproduce. This milestone also
      fixed the reads underneath every surface: sweep_deaths clears
      is_dead on every pass (faithful to FUN_00464870, pinned by
      test_combat), so player_won/won/banner reads through is_dead were
      always false and every real fight registered as a loss - all of them
      go through Battle.hero_won now, and the status-effect hooks that
      could zero life (poison, Fire Bombed, Hasted) land is_dead at the
      tick like the damage path does.
    supersedes: null
    date: 2026-10-10

  - id: port.banner_slot_removed
    decision: >
      The equipment record no longer carries a banner field. The panel keeps
      weapon, armor, helm, gauntlets, the two rings, mount and companion -
      the slots the shipped game fills - and the save reader ignores a
      "banner" key older files may still carry.
    rationale: >
      The field was speculative from the project's first commit and nothing
      in the shipped game ever fills, shows or reads a banner: all 160 item
      XMLs declare one of four locations (weapon/head/body/misc - the
      [ITMLOC0..3] headings), GameText carries no [BANNER] tag (the word
      appears only in Q2Q6's war-banner quest prose and as the UWAR+UMAS
      rune word), the Lua native surface has no banner call among its 162
      tokens, no screen XML names a banner widget, and the exe holds no
      banner string in either encoding. Mount keeps its panel slot because
      [ITMLOC5] "--- Mounts ---", MOUNTS_HELP and INV_MOUNTS_TEXT ground
      it; banner has no such anchor anywhere. Deleting the field rather
      than parking it keeps the record honest: loadout_of_equipment folded
      e.banner (always None) into the loadout, the save round-tripped a
      key that could never be non-None, and a reader of the type would
      take a banner slot for a mechanic. Old saves load untouched - the
      reader only asks for keys it knows - and test_capture pins that
      with a banner-keyed file. The Victory banner in conv_window is
      unrelated UI and unaffected.
    supersedes: null
    date: 2026-10-10

  - id: port.rune_forge_formula
    decision: >
      The forge spec computes base' = base.data * modifier.data_mult +
      modifier.data_add and power' = power.data * modifier.power_mult +
      modifier.power_add, the power rounded to nearest; the difficulty
      stacks both diff fields - (base.diff_add + modifier.diff_add) *
      modifier.diff_mult - also rounded to nearest. The three gifted runes
      ride with a fresh hero, and a world rune is claimable while the hero
      stands at its node (the guardian fight surface is still open).
    rationale: >
      Each modifier's description states its own arithmetic verbatim - UMAS
      "Adds +2 to Base Rune ability", UCHA "-1 base and +150% to power"
      (data_add -1, power_mult 2.5), GIA "-50% to power" (power_mult 0.5)
      - so the formula is read from the data rather than guessed, and
      test_runes pins it against those strings. The shipped data_mults are
      all 1 and power_adds all 0, so only the roundings need a choice: a
      1.75 multiplier over a 2 is 3.5 and rounds to nearest (4); floor
      would contradict the "+75%" reading of an item that says it adds
      something. The difficulty stack (b+m)xmm rather than b x mm + m is
      the reading under which every shipped combination stays integral
      (diff_add 100..200 x diff_mult 1.0..3.0, plus UGOD's +50); the ten
      [FORGEITEMS_TARGET*] bands that bucket the result arrive with the
      forge UI. The gifted three are the only runes with no guard and no
      location - unclaimable anywhere - which is what
      [RUNESANDITEMS_HELP]'s "you have been given the 3 most common
      Runes" describes; they ride with create_player rather than granted
      on load, the way starting spells do. The claim gate is standing at
      the node because that is all the port can hold until the runekeeper
      fight surface exists (RUNE_HELP: "You must defeat this guardian to
      claim the Rune").
    supersedes: null
    date: 2026-10-10

  - id: port.rune_item_mint
    decision: >
      forge_item mints the spec into a real inventory item: id "R" ^ base
      ^ modifier ^ power, name and icon from the (base, modifier) table,
      the slot from the base's position, and the power text carries both
      abilities with their data filled. The loadout resolves minted ids
      into runtime items whose JXXX hooks ride the existing machinery -
      OnGiveDamage for bases 0/1/9 and per-item OnStartBattle payoffs for
      powers 0-4 - and a loaded save rebuilds a mint from its id alone. A
      duplicate triple yields no extra copy.
    rationale: >
      The id encodes the triple, so nothing has to persist but the id:
      campaign_save's inventory and equipment restore through
      resolve_item, which falls back from the fixed table to a rebuild
      that recomputes the arithmetic and re-registers the session hooks -
      the same trick that lets old saves load without a rune field. cost
      and rarity stay 0: no shipped data prices a forged item, and the
      shop's selling flow is unported, so inventing a price would be a
      number with nothing to read it. [RUNEDUP_TEXT] states the dupe rule
      verbatim - "you will not receive an extra item" - so the inventory
      holds one copy and a reforge is a no-op that still answers with the
      item. Of JXXX's bodies, the wired set is the two whose rune bodies are
      written: OnGiveDamage (bases 0/1 add BASEDATA on hits of 3+, 9 on hits
      of 6+) through the damage pass, and OnStartBattle (powers 0-3 credit
      POWERDATA of that mana, 4 raises max life and life) through
      Item_hooks' payoff walker, which gained a per-item table for the
      purpose. The quiet bodies: base E's reflect damages the attacker from
      outside the damage-transform signature, powers 9/A want a per-event
      percentile (the IBSH absence), and the skill, resistance, victory,
      match and cast bodies are unwritten for runes - of those kinds, battle
      invokes victory and match now for fixed items (port.item_event_
      dispatch_order) but nothing has ported JXXX's own version, and the
      skill and cast kinds still have no dispatch point for any item. Base D
      reads GET_MAX_MANA, which the loop models since ceilings moved onto
      Combat.max_mana, so that one is a body to write rather than a hole.
      The [MAXRUNEITEM] cap and the forge UI stay open with it.
    supersedes: null
    date: 2026-10-10

  - id: port.forge_ui
    decision: >
      The forge lives in the city panel as a Forge tab cycling after Pets:
      the held runes list with kind tags, a click fills or clears one of
      three slots (base, modifier, power), the status line shows the
      triple with its [FORGEITEMS_TARGET*] difficulty band, and the
      centred forge button - City_layout.forge_btn between Done and the
      mode button - forges through forge_item. Forging is instant. The
      world side is the node you stand on: a rune's location click opens
      the keeper popup, the guard monster as a synthetic encounter under
      [RUNEKEEPER], and winning claims through claim_rune.
    rationale: >
      SelectRuneMenu's own furniture (three rune columns, OKAY, the
      str_target difficulty line) maps onto the port's tab pattern the
      way the Pets tab did, and the ten equal sixty-point bands behind
      forge_band are a port choice because the exe's thresholds are not
      recovered - every shipped combination lands between 100 and 600, so
      the bands at least separate the gifted triple (100) from a
      UDAG+UGOD pairing (450). Forging is instant because the skill game
      [FORGEITEMS_FAIL] implies is not ported for any system yet (spell
      research has the same shape); the failure string therefore stays
      unused, and [FORGEITEMS_HELP0]'s "build a Forge" gate rides the
      citadel-building system the port has not modelled - the shop's own
      precedent, since buy_item is not building-gated either. The keeper
      fight reuses the road popup wholesale: the encounter type is a
      sprite and a level, so the synthetic record (id RUNEKEEPER, the
      guard's sprite and level_base, the node as its end_) runs through
      run_encounter_battle and process_battle_result like any road fight,
      which also means a keeper win can offer the guard to the capture
      minigame like any other win. Clicking the standing node is the
      trigger because arrival is already a busy moment (the enter_location
      queue) and the port's map has no hover affordance - the console
      line tells the player the keeper is there.
    supersedes: null
    date: 2026-10-10

  - id: port.mount_training
    decision: >
      Training lives on the player as mount_levels (absent = level 1, the
      level a capture starts at). The challenge fights the mount's own
      kind at the next level for seconds = max 20 (60 - 5 * (next - 2)),
      read as a turn budget of three turns a second; a win inside the
      budget writes the new level, and the city's Training tab runs the
      confirm-through-the-console flow ([TRAINMOUNTS_DETAIL], second
      click, [TRAINMOUNTS_SUCCESS]). The training level - not the
      rider's - feeds mount_skill_bonus, superseding
      port.mount_skill_formula's level source, and each level adds ten
      percent departure avoidance capped at fifty.
    rationale: >
      [TRAINMOUNTS_DESC], [TRAINMOUNTS_DETAIL] and
      [TRAINMOUNTS_SUCCESS] state the flow verbatim - defeat "this
      creature" (the mount's own kind) at "level %d" with "%d second
      time limit", success adds +1 - but the exe's numbers appear in no
      text, Lua or screen XML, so both curves are port choices: the
      clock shrinks with level as "the higher the level, the faster you
      will need to be" demands, and three turns a second exists because
      the port battles headless under the auto-AI, which needs roughly
      a hundred turns to finish what a human matching gems quickly does
      inside the original's minute (the first reading, five seconds a
      turn, made every training unwinnable in play). SELECTMOUNTMENU_TEXT
      settles the formula's level: training "helps to improve your
      skills in combat", so the (level - 1) / addlevel steps read the
      mount's training level - a fresh capture stays 1, which keeps the
      verbatim +N at level 1 the original formula decision pinned.
      YOURCITY_MOUNTS_TEXT separately ties avoidance to levels gained
      "through training" ("they also begin to let you avoid some
      encounters on the map"), which is where ten percent a level,
      capped at half, comes from: no shipped number states a chance, and
      a capped ramp makes level 1 matter while keeping half as the
      ceiling a low-level rider can reach. [TRAINMOUNTS_HELP0]'s Stable
      gate rides the unported citadel buildings, the way the Forge tab
      skips [FORGEITEMS_HELP0].
    supersedes: port.mount_skill_formula
    date: 2026-10-10


  - id: port.item_event_context
    decision: >
      Every item hook - the six event kinds and both damage chains - takes an
      item_context carrying ic_self, ic_level and a set of native callbacks, in
      place of the Lua's characterIdx argument.
    rationale: >
      There is no character array to index - a battle is two combatants - and
      every ported body wants either the character itself (a mana, life or
      status read) or a native bound to it (ADD_MANA_<E>, ADD_GOLD, ADD_XP,
      EXTRA_TURN, Std_InflictDamage, Std_Healing, ADD_STATUS_EFFECT). The
      callbacks are what let a body credit a second pool through the very fold
      that is running it, which is how the ADD_MANA native behaves: IBFH
      crediting Earth from a red credit re-enters OnReceiveMana, and the IRO*
      cycle goes round four times before a share truncates to zero. The resist,
      skill and clear bodies go straight at Combat through ic_self instead, so
      the callback set stays the natives that need the battle to answer - and
      ADD_STATUS_EFFECT takes the combatant rather than closing over ic_self,
      because every script that calls it passes its target. Three smaller
      pieces of the same choice: ic_percentile is a draw-per-call closure
      rather than a number, so PERCENTILE_CHANCE_SYNC costs a roll only where
      the Lua spends one and two rolled bodies stacked get two rolls each (an
      int field forced one phantom draw per damage event, which is what kept
      sixteen bodies unported); ic_attacker / ic_defender stay empty outside a
      damage event because they are that event's two parties, filled in by
      Battle.damage_context; and ic_level carries the hero's level, the only
      one a battle has, so the one body that reads GET_LEVEL works for the
      wearer the campaign actually dresses.
    supersedes: null
    date: 2026-10-12

  - id: port.item_event_dispatch_order
    decision: >
      Items run before status effects at turn start and inside them for
      experience; the match pair fires under the size_patterns gate and one of
      OnMatch4 / OnMatch5 only, never both; OnVictory fires at the moment the
      winner is decided; and the gold and xp folds sit where the battle
      accrues them rather than where the campaign settles them.
    rationale: >
      The damage chain already records items-first as its reading of an
      unrecovered ordering, and this extends that reading rather than
      inventing a second one for two more events. A five-run fires match5
      alone because IRKK's match5 body is a call to its own match4, which
      would be redundant if the engine fired both, and the Lua comments tie
      both hooks to the extra turn a four-run grants - so they share the
      size_patterns gate that grant sits behind. Victory fires at the
      transition inside take_turn rather than at the end of Battle.run, so a
      finished fight cannot run it twice. The gold and xp folds are in the
      battle because every body behind them is only meaningful there: IRBR
      triples "gold from matching gems", IXHD banks a turn on receiving gold,
      IMSE doubles experience "during battle", IALR and IAOB pay mana out of
      it while there is mana to pay into - and IHTR's +50 arrives through the
      same fold at the end of the fight it won, so the spoils the campaign
      settles already carry it.
    supersedes: null
    date: 2026-10-12

  - id: port.item_board_writes
    decision: >
      The item context writes the battle's board through ic_set_gem,
      ic_destroy_gem and ic_multipliers; reads come from the grid the context
      was built over; the match hooks run against the clearing grid; and the
      damage chain refills afterwards.
    rationale: >
      The board is a value, so a hook cannot be handed a way to write it that
      also sees later writes - the context snapshots the grid at hook entry and
      the callbacks swap a new board into the battle, which is how the spell
      bodies already reach the grid through fx_board. Snapshots are enough for
      the nine bodies: a sweep or a single conversion reads the grid it started
      with and writes through the callback, and the one case where a later body
      should see an earlier one's write - IADO's sweep on one side, ICAR's pick
      on the other - is handled by building the defender's context after the
      attacker's chain has run rather than beside it. Two placements follow.
      The cascade advances b.board to the clearing state before it walks the
      runs, because b.board <- cleared after them would throw a match hook's
      write away; a hook therefore reads the grid with its matches gone, which
      is the grid the cascade itself works from. And gravity plus refill run
      after the damage chain, gated on the board having changed: DESTROY_GEM
      empties cells here the way it does for spells, the next swap must not
      resolve holes, and on an intact board both steps are the identity and
      refill draws nothing, so a fight whose items only change numbers pays no
      rng for it. SetMultiplierEffects is transcribed even though IADO turns
      the flags off and back on within one event and nothing reads them in
      between - the moment DESTROY_GEM starts resolving a chain, the flags are
      what it would consult.
    supersedes: null
    date: 2026-10-12

  - id: port.mana_credit_registry
    decision: >
      Combat.credit_mana dispatches through a battle-scoped registry that
      Battle.create installs, guarded by physical membership in that battle''s
      roster; the fold banks through Combat.bank_mana, which is the clamp with
      no hook.
    rationale: >
      The fold cannot live in Combat - Item opens Combat, so Combat cannot name
      Item - and threading it through Spell_effects.add_mana would mean widening
      a signature that fifteen bodies call and every test that builds an
      effect_context has to keep up with. A callback registered at create gets
      the same coverage for one hook and no call-site churn, and it is the
      mechanism status.md already anticipated. The membership test is physical
      equality rather than a compare on id: every fight has a hero at id 0, so
      an id check would fold a foreign combatant into this battle''s loadout,
      and a credit outside any fight has to fall through to the raw clamp.
      [Battle.receive_mana] ends in bank_mana rather than credit_mana for the
      same reason in reverse - credit_mana is the dispatcher it would be
      dispatching to, and the two would chase each other. Uncapped credits (the
      OnStartBattle payoffs, the companion ManaBonus) write the pool directly
      and stay outside, as port.item_start_battle_dispatch already records.
    supersedes: null
    date: 2026-10-12

  - id: port.missed_turn_placement
    decision: >
      A [Missed] turn is spent after the worn items'' OnStartTurn and before
      the status effects'' start hooks; it advances turns_elapsed, emits
      MissedTurn, still records the outcome, and ticks neither cooldowns nor
      effect durations.
    rationale: >
      ITUT - "Owner never takes a turn" - is an OnStartTurn body, so the status
      it sets has to be read after that hook and before the action, or the
      owner would take the turn it just asked to miss; the scripts'' own
      "before the turn is actually started" describes the same window. Reading
      it before the status start hooks is forced anyway: that pass keeps only
      ids it has a descriptor for and would drop the pseudo-status on the
      floor. Skipping the cooldown tick follows from what a cooldown counts -
      the caster''s own turns, and this was not one - while the round and the
      cap still move, because a fight in which everyone is stunned has to end.
      The outcome check stays: a corpse that sits out its turn still has to
      finish the fight rather than hold the loop open until the status expires.
    supersedes: null
    date: 2026-10-12

  - id: port.mana_ceiling_from_skills
    decision: >
      A combatant's ceilings default to 25 + (skill + 1) / 2 over the skills it
      was built with, in place of the flat 20 the port used to ship; an explicit
      max_mana still wins.
    rationale: >
      The constructor's formula is recovered (mana.ceiling.base_value), and
      make_combatant already takes a skills record - so deriving the default
      from it costs one reordered parameter and fixes every construction site
      at once: player_to_combatant and monster_to_combatant both pass skills and
      neither has to know about ceilings, while a test that wants a specific cap
      says so. base_mana_limit replaces the old chosen 20 as the zero-skill
      base, and default_mana_limit keeps its name (now equal to it) because the
      tests compare against the name rather than the number. The raw skill
      stands in for the effective one at construction time, which is correct:
      quest.base_value_from_level is now answered - level does not fold in, and
      the hooks and temp-skill accumulator that complete the effective skill are
      battle-time additions that do not move the construction-time ceiling.
    supersedes: null
    date: 2026-10-12
