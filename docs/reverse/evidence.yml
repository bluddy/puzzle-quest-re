    evidence:
      - kind: decompiled
        ref: docs/decompiled/Engine_ADD_EFFECT_TO_GRID_4b51d0.c
        quote: |
          iVar2 = sStack_1c + 0x24;   // the cell's pixel coordinates
          iVar1 = sStack_1a + 0x24;
