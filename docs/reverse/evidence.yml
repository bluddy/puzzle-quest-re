  - id: board.flag_pattern_45
    title: Board flag +0x395 gates extra effects on runs of exactly 5 and exactly 4
    area: board
    verdict: mechanic
    status: recovered
    confidence: high
    source_pass: original_reverse
    summary: >
      Confirmed in the binary. It has exactly two reads, and each sits directly
      behind a size test on the match, which is what makes the claim specific
      rather than a guess about a flag name:

      - `0x0047cefe` follows `cmp ecx, 5` / `jl`. A run of five or more, with
        the flag set, calls `0x4156f0` with element 3 and the constant 10.
      - `0x0047d074` follows `cmp dword ptr [esi + 0xc], 4` / `jne`. Exactly
        four, with the flag set, calls it with element 2 and the constant 9.

      Both share one spelling: a singleton lookup through `0x4646e0` ->
      `0x447c60` -> `0x446200` and a virtual call, then `0x4156f0` with `0x7d0`
      (2000) and a stack buffer. So the two sizes are handled by one code path
      parameterised by element and constant, and the flag decides whether either
      runs at all.

      What the effect *is* is still unidentified - the port does not implement
      these two effects, only the flag. Note also that the size tests are
      asymmetric: the five case is `>= 5` and the four case is `== 4`.
    evidence:
      - kind: binary
        ref: game/Puzzle Quest.unpacked.exe
        note: >
          0x0047cefe `mov al, byte ptr [ebx + 0x395]` / `test` / `je`, guarded by
          `cmp ecx, 5`; 0x0047d074 the same shape guarded by
          `cmp dword ptr [esi + 0xc], 4`. Found with
          tools/scan_field_refs.py 0x395.
      - kind: lua
        ref: game/Assets.zip!Assets/Scripts/GridUtilities.lua
        note: >
          SetMultiplierEffects deliberately does NOT touch +0x395, which is how
          the port knows the flag is independent of the other three.
      - kind: code
        ref: tools/scan_field_refs.py
    affects: [lib/board.ml, lib/spell.ml]

  - id: board.isolation_is_orthogonal_only
    title: Skull isolation checks four neighbours, not eight
    area: board
    verdict: mechanic
    status: recovered
    confidence: high
    source_pass: original_reverse
    summary: >
      `NoAdjacentGems` in `GetRandomGrid.lua` tests only left, right, up and
      down, with bounds checks that never look off the board. Four, not eight,
      and that is the whole point of the rule: matches in this game are
      horizontal and vertical, so a diagonally adjacent skull cannot chain and
      must not disqualify a cell.

      The port had been testing all eight neighbours including diagonals, which
      made `GetRandomGrid_Isolated2` strictly pickier than the original. On a
      crowded board it rejected cells the game accepts and then fell through to
      the give-up case, so SBAC dropped its red skull in the wrong place.
      Corrected, with a test that fails under the eight-neighbour rule.
    evidence:
      - kind: lua
        ref: game/Assets.zip!Assets/Scripts/GetRandomGrid.lua
        note: >
          NoAdjacentGems tests x-1, x+1, y-1, y+1 only; GetRandomGrid_Isolated2
          calls it once per type and caps the search at 1001 draws.
      - kind: code
        ref: lib/spell_effects.ml
        note: no_adjacent_gems and random_grid_isolated2
      - kind: code
        ref: test/test_spell_effects.ml
        note: >
          A board where the only legal cell has one diagonal and no orthogonal
          skull, which the eight-neighbour rule rejects.
    affects: [lib/spell_effects.ml, lib/board.ml]

  - id: board.random_grid_helpers_exhaustive
    title: Five GetRandomGrid helpers cover every call site in the game
    area: board
    verdict: mechanic
    status: recovered
    confidence: high
    source_pass: original_reverse
    summary: >
      Every call site across all 129 spells and 17 status effects resolves to
      one of five helpers - `GetRandomGrid`, `_Not`, `_Not2`, `_Isolated2` and
      `_Type` - and all five are ported. `GetRandomGrid_Not3`, `_Isolated` and
      `_Type2` exist in the asset but no spell calls them, so there is no
      unported body hiding behind them.

      `GetRandomGrid` is `GET_RANDOM_SYNC(1,8)` twice, and the 1001-draw cap in
      the `_Not*` and `_Isolated*` variants matches the port.
    evidence:
      - kind: lua
        ref: game/Assets.zip!Assets/Scripts/GetRandomGrid.lua
      - kind: code
        ref: lib/spell_effects.ml
        note: the five ported helpers
    affects: [lib/spell_effects.ml]

  - id: board.grid_helpers_iterate_row_major
    title: GridUtilities helpers scan y outer, x inner
    area: board
    verdict: mechanic
    status: recovered
    confidence: high
    source_pass: original_reverse
    summary: >
      `CountGems`, `DestroyAllGems`, `DeleteAllGems`, `EffectOnAllGems` and
      `ChangeAllGems` all nest `for y` outside `for x`, which is row-major - the
      same order the port uses. Worth recording because the opposite nesting is
      an easy mistake to make and would be observable in any helper that reports
      the first cell it finds rather than a count.

      `DestroyAllGems` and `DeleteAllGems` add their effect to the cell they just
      cleared, and `ExplodeGem` clears a bounds-checked 3x3 around its centre
      while `ExplodeAllGems` adds the effect at the centre, not at each cleared
      cell.
    evidence:
      - kind: lua
        ref: game/Assets.zip!Assets/Scripts/GridUtilities.lua
      - kind: code
        ref: lib/spell_effects.ml
        note: count_of_type, destroy_all_gems, delete_all_gems, effect_on_all_gems
    affects: [lib/spell_effects.ml]

  - id: board.grid_patterns_is_unused
    title: GridPatterns.lua is dead code - no spell calls it
    area: board
    verdict: mechanic
    status: recovered
    confidence: high
    source_pass: original_reverse
    summary: >
      Reading the file in full closed the question it was filed under. Its
