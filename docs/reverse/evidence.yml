    affects: [lib/campaign.ml, lib/campaign_save.ml]
    notes: >
      Which nodes a quest reveals is a separate fact, extracted from the
      QUEST_SET_VISIBILITY and QUEST_ADD_RUIN calls in each quest's Lua and grouped
      by hook (reveal_on_begin / reveal_on_end / ruin_reveals) by
      tools/extract_quests.py. Persistence rides the city-status record: the
