  - id: ai.difficulty_from_levels
    title: Std_GetDifficulty derives the difficulty band from the hero/task level gap
    area: spells
    verdict: mechanic
    status: recovered
    confidence: high
    source_pass: presentation_audit
    summary: >
      Five bands, not three. `Battle.rules.difficulty` was a hand-set field
      documented as "0 easy, 1 normal, 2+ hard", which was a guess at a value the
      game computes: an encounter's difficulty is the gap between the hero's level
      and the task's.

          taskLevel < heroLevel - 6   -> 0
          taskLevel < heroLevel - 1   -> 1
          taskLevel < heroLevel + 3   -> 2
          taskLevel < heroLevel + 8   -> 3
          otherwise                  -> 4

      Every comparison is strict, so for a hero of 10 the bands are task levels
      3 and below, 4-8, 9-12, 13-17, and 18 and above.

      This is the quest-to-battle bridge and the only thing that decides what
      `Battle.rules.difficulty` is. That value gates the AI's spell skip
      (`pick_ai_spell`, 50/25/0 percent by band) and the board evaluator's
      jitter, so getting it wrong makes every fight the wrong difficulty.

      Ported as `Spell.difficulty_for_levels`. It lives in spell.ml rather than a
      quest module because there is no quest module yet and that is its only
      consumer.
    evidence:
      - kind: lua
        ref: game/Assets.zip!Assets/Scripts/StandardUtilityScripts.lua
        quote: |
          function Std_GetDifficulty(heroLevel,taskLevel)
              if (taskLevel < heroLevel-6) then return 0;
              elseif (taskLevel < heroLevel-1) then return 1;
              elseif (taskLevel < heroLevel+3) then return 2;
              elseif (taskLevel < heroLevel+8) then return 3;
              end
              return 4;
          end
      - kind: code
        ref: lib/spell.ml
        note: difficulty_for_levels
    affects: [lib/spell.ml, lib/battle.ml]

