  - id: ai.difficulty_from_levels
    title: Std_GetDifficulty derives the difficulty band from the hero/task level gap
    area: spells
    verdict: mechanic
    status: recovered
    confidence: high
    source_pass: presentation_audit
    summary: >
      Five bands, not three. `Battle.rules.difficulty` was a hand-set field
      documented as "0 easy, 1 normal, 2+ hard", which was a guess at a value the
      game computes: an encounter's difficulty is the gap between the hero's level
      and the task's.

          taskLevel < heroLevel - 6   -> 0
          taskLevel < heroLevel - 1   -> 1
          taskLevel < heroLevel + 3   -> 2
          taskLevel < heroLevel + 8   -> 3
          otherwise                  -> 4

      Every comparison is strict, so for a hero of 10 the bands are task levels
      3 and below, 4-8, 9-12, 13-17, and 18 and above.

      This is the quest-to-battle bridge and the only thing that decides what
      `Battle.rules.difficulty` is. That value gates the AI's spell skip
      (`pick_ai_spell`, 50/25/0 percent by band) and the board evaluator's
      jitter, so getting it wrong makes every fight the wrong difficulty.

      Ported as `Spell.difficulty_for_levels`. It lives in spell.ml rather than a
      quest module because there is no quest module yet and that is its only
      consumer.
    evidence:
      - kind: lua
        ref: game/Assets.zip!Assets/Scripts/StandardUtilityScripts.lua
        quote: |
          function Std_GetDifficulty(heroLevel,taskLevel)
              if (taskLevel < heroLevel-6) then return 0;
              elseif (taskLevel < heroLevel-1) then return 1;
              elseif (taskLevel < heroLevel+3) then return 2;
              elseif (taskLevel < heroLevel+8) then return 3;
              end
              return 4;
          end
      - kind: code
        ref: lib/spell.ml
        note: difficulty_for_levels
    affects: [lib/spell.ml, lib/battle.ml]

  - id: ai.spellcasting_chance_confirmed_from_lua
    title: Std_AISpellcastingChance confirms the modifier's sign from source
    area: spells
    verdict: mechanic
    status: recovered
    confidence: high
    source_pass: presentation_audit
    summary: >
      Independent confirmation of `spells.ai_modifier_direction`, which until now
      rested on reading the port's own OCaml back to itself.

          if (chance > 50 + modifier) then return 0;
          if (evaluation > 30) then return 0;
          return 1;

      So a positive modifier raises the threshold and the spell casts *more*
      often - the opposite of what three documents in this project claimed. The
      prose was corrected in 2d37977 on the strength of the code; this is the
      original agreeing.
    evidence:
      - kind: lua
        ref: game/Assets.zip!Assets/Scripts/StandardUtilityScripts.lua
        quote: |
          function Std_AISpellcastingChance(modifier)
              local evaluation = EVALUATE_BOARD();
              local chance = PERCENTILE_CHANCE_SYNC();
              if (chance > 50 + modifier) then return 0;
              if (evaluation > 30) then return 0;
              return 1;
          end
    affects: [lib/spell.ml, lib/spell_ai.ml, lib/spell_ai_manual.ml]

  - id: gold.per_character_confirmed
    title: Gold is per character, confirmed by Std_LoseGold / Std_GainGold
    area: combat
    verdict: mechanic
    status: recovered
    confidence: high
    source_pass: presentation_audit
    summary: >
      `SUBTRACT_GOLD(idx, amt)` and `ADD_GOLD(idx, amt)` both take a character
      index. That confirms `Combatant.gold`, the field added for SSTL, and
      confirms SSTL's direction: `Std_LoseGold(amt, idxEnemy)` then
      `Std_GainGold(amt, idxCaster)`, so the gold moves from the enemy to the
      caster and the battle-wide total is not what moves.

      Both helpers also pop a text message; that part is presentation.
    evidence:
      - kind: lua
        ref: game/Assets.zip!Assets/Scripts/StandardUtilityScripts.lua
        quote: |
          function Std_LoseGold(amt,idx)
              SUBTRACT_GOLD(idx,amt);
              local msg = GET_TEXT_FORMAT_INT("[SPELL_EFFECT_GOLDLOSS]",amt);
              ADD_TEXT_MESSAGE_TO_CHARACTER(idx, msg,2,MESSAGE_ORANGE);
          end
    affects: [lib/combat.ml, lib/spell_effects.ml]

  - id: scripts.std_helpers_are_lua
    title: The Std_* helpers are Lua in Assets/Scripts, not C natives
    area: spells
    verdict: mechanic
    status: recovered
    confidence: high
    source_pass: presentation_audit
    summary: >
      Worth recording as its own claim, because getting it wrong cost real time.
      Every `Std_` helper - Std_InflictDamage, Std_Healing, Std_CastSpellEffect,
      Std_AISpellcastingChance, Std_GetDifficulty and the rest - is a global Lua
      function in `Assets/Scripts/StandardUtilityScripts.lua`, not a native.

      They were assumed to be natives, which put four of them on a decompilation
      work queue that would never have paid off. There are only five `.lua` files
      under Assets/Scripts and they total about 28KB; all of them are now read.

      The natives are the `ADD_*`, `SET_*`, `GET_*` names, which is the split the
      LUA_API.md table records.
    evidence:
      - kind: lua
        ref: game/Assets.zip!Assets/Scripts/StandardUtilityScripts.lua
        note: 9026 bytes, 386 lines
      - kind: lua
        ref: game/Assets.zip!Assets/Scripts/GridUtilities.lua
      - kind: lua
        ref: game/Assets.zip!Assets/Scripts/GridPatterns.lua
    affects: [lib/spell_effects.ml, lib/status_effect_hooks.ml]
    notes: >
      GridPatterns.lua is 10KB and still unread. It is where the 4/5-of-a-kind
      pattern rules live, so it is the next place to look for
      board.flag_pattern_45.

